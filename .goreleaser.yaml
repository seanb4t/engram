#
# goreleaser configuration — https://goreleaser.com
# Builds the multi-arch image + GitHub release on tag. The OCI Helm chart is
# pushed separately by `task chart:push` in the release workflow.
version: 2

project_name: engram

# No `before.hooks: [go mod tidy]` — release builds must use the exact tagged
# go.mod/go.sum (tag = source of truth). Tidiness is enforced in CI (ci.yaml
# test job: `go mod tidy` + `git diff --exit-code`), not mutated here.

gomod:
  proxy: true

builds:
  - id: engram
    main: ./cmd/engram
    binary: engram
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}

# Developer ID signing and Apple notarization of the darwin binaries, in
# process through quill (no codesign or xcrun), so it runs on the Linux
# release runner. It is a build-stage pipe, so the archives and checksums
# below cover the signed bytes.
#
# `enabled` requires all five variables set and non-empty. With any of them
# missing the pipe is skipped, not failed, so a local snapshot builds
# unsigned; on a release, release.yaml's "Require the macOS signing secrets"
# step fails the job before GoReleaser runs instead (the tag and GitHub
# Release already exist by then). Do not narrow `enabled` to the signing
# pair: GoReleaser would then sign and quietly skip notarization. Apple
# rejecting a submission, or a certificate that does not load, fails the
# pipe; a notarization that times out or is still pending is logged and
# passed over, which release.yaml's verify-macos job catches after the
# binaries are published. No entitlements: engram needs no JIT.
notarize:
  macos:
    - enabled: |-
        {{ and (isEnvSet "MACOS_SIGN_P12") (isEnvSet "MACOS_SIGN_PASSWORD") (isEnvSet "MACOS_NOTARY_ISSUER_ID") (isEnvSet "MACOS_NOTARY_KEY_ID") (isEnvSet "MACOS_NOTARY_KEY") }}
      # Must name the darwin build's builds[].id; an id that matches no
      # build skips the pipe. releaseconfig_test.go checks it.
      ids:
        - engram
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

dockers:
  - image_templates:
      - "ghcr.io/seanb4t/engram:{{ .Version }}-amd64"
    use: buildx
    dockerfile: Dockerfile.goreleaser
    goos: linux
    goarch: amd64
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
  - image_templates:
      - "ghcr.io/seanb4t/engram:{{ .Version }}-arm64"
    use: buildx
    dockerfile: Dockerfile.goreleaser
    goos: linux
    goarch: arm64
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"

docker_manifests:
  - name_template: "ghcr.io/seanb4t/engram:{{ .Version }}"
    image_templates:
      - "ghcr.io/seanb4t/engram:{{ .Version }}-amd64"
      - "ghcr.io/seanb4t/engram:{{ .Version }}-arm64"
  - name_template: "ghcr.io/seanb4t/engram:latest"
    image_templates:
      - "ghcr.io/seanb4t/engram:{{ .Version }}-amd64"
      - "ghcr.io/seanb4t/engram:{{ .Version }}-arm64"

# No `changelog:` block — release-please owns the changelog (CHANGELOG.md + the
# GitHub Release notes body), derived from Conventional Commits.
release:
  # release-please creates the GitHub Release (changelog body); GoReleaser only
  # uploads artifacts to that already-created, tag-keyed release.
  # replace_existing_artifacts makes re-runs idempotent.
  replace_existing_artifacts: true

# homebrew_casks: is GoReleaser's current cask publisher — brews: (formula) is
# deprecated and must not be introduced. The publisher DOES override
# repository.token (see below): #516 replaced the original single-token design
# (D-12, release-please App as GITHUB_TOKEN widened to seanb4t/homebrew-tap)
# with a dedicated tap-publisher App, so the release credential can no longer
# reach the tap. Do not re-widen the release App to the tap.
homebrew_casks:
  - name: engram
    repository:
      owner: seanb4t
      name: homebrew-tap
      # A dedicated tap-publisher App's token, NOT the release App's. This
      # overrides GITHUB_TOKEN for this publisher only, so the credential that
      # writes the tap cannot cut a release and the credential that cuts
      # releases cannot write the tap. One App, one purpose.
      #
      # MUST stay the bare `{{ .Env.NAME }}` form. GoReleaser regex-matches this
      # field against `^{{\s*\.Env\.[^.\s}]+\s*}}$` on the RAW config string
      # before expanding it (internal/tmpl ApplySingleEnvOnly), deliberately
      # refusing credentials composed from any other interpolation. The previous
      # `{{ if .Env.X }}…{{ end }}` guard could never match and failed v0.15.0
      # with "expected {{ .Env.VAR_NAME }} only".
      #
      # No fallback is needed for an unset var: this field is only read on the
      # cask pipe's PUBLISH path, which `--snapshot` never reaches and which
      # `skip_upload: true` short-circuits before token resolution. That is also
      # why `goreleaser check` and every PR run stay green on a broken value —
      # only a real tag exercises it.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/seanb4t/engram
    # Copied byte-for-byte from rootCmd.Short (cmd/engram/root.go:27) — the
    # project's one established one-liner, already shipped in `engram --help`.
    # YAML cannot reference a Go constant, so this duplication is unavoidable;
    # it is made checkable by a plan acceptance criterion that extracts the
    # literal from root.go and requires the identical bytes here.
    description: Self-hosted, correctable, OAuth-secured memory for coding agents
    # Guarded optional-env: emits the workflow guard step's computed value,
    # falling back to "false" when SKIP_HOMEBREW_UPLOAD is unset entirely
    # (e.g. `task release:snapshot` run locally), so local snapshot renders
    # keep working while CI always supplies the real value. A bare
    # {{ .Env.SKIP_HOMEBREW_UPLOAD }} would hard-fail template evaluation
    # whenever the variable is unset. GoReleaser's template functions cannot
    # run `git tag -l`, which is why the newest-tag comparison is computed
    # in the workflow and only read here.
    #
    # Not skip_upload: auto — that skips uploads for tags carrying a
    # prerelease indicator, a different rule from the newest-tag rule this
    # guard implements, and layering it on top would make the effective
    # condition harder to reason about than either alone.
    #
    # This is the guard that keeps a workflow_dispatch backfill of an older
    # tag from regressing the tap: this repo already lost `latest` to a
    # v0.11.0 backfill after v0.11.1 had shipped, and a version-pinned cask
    # would fail the same way with no floating tag to notice it by.
    skip_upload: '{{ if index .Env "SKIP_HOMEBREW_UPLOAD" }}{{ .Env.SKIP_HOMEBREW_UPLOAD }}{{ else }}false{{ end }}'
    # The install runs the installed binary, and any failure fails the
    # install. These hooks render as the cask's postflight_steps and
    # uninstall_postflight_steps, Homebrew's declarative steps DSL: literal
    # step calls, no Ruby. No step sets must_succeed, so every `run` keeps
    # the default, true. The cask keys completions:, manpages: and
    # generate_completions_from_executable stay unset: the first two install
    # prebuilt files instead of running the binary, and the helper turns a
    # failure into a warning. releaseconfig_test.go checks the steps, their
    # order and paths, and that these keys, must_succeed and xattr stay out.
    #
    # Do not add quarantine removal (xattr), here, in a pre hook or in a
    # custom_block: the darwin binaries are signed and notarized (notarize:
    # above), so Gatekeeper runs the quarantined binary.
    #
    # GoReleaser templates these bodies with the same {{ }} delimiters as
    # Homebrew's install-time tokens, so every Homebrew token is written
    # quoted, as {{ "{{HOMEBREW_PREFIX}}" }} and {{ "{{version}}" }}. The
    # paths name HOMEBREW_PREFIX directories rather than Homebrew's
    # {{bash_completion}}-style tokens, which follow per-install cask
    # directory settings, so install and uninstall name the same files.
    hooks:
      post:
        # The `run "bin/engram", base: :homebrew_prefix` steps exercise the
        # linked binary, not the staged archive. `--expect` makes the binary
        # compare its own version with the cask's (the DSL cannot) and exit
        # non-zero on a mismatch. Its argument must be Homebrew's {{version}}
        # token, which expands to the cask's version stanza at install time,
        # not GoReleaser's .Version, which is fixed when the cask is rendered.
        # A `run` with stdout_path writes the file only when the command
        # succeeds. The steps run in Homebrew's write sandbox, which allows
        # writes only to the paths a step declares: keep both the mkdir_p and
        # the man step's writable_paths, although `engram man` also creates
        # the directory.
        install_steps: |-
          run "bin/engram",
              base: :homebrew_prefix,
              args: ["version", "--expect", "{{ "{{version}}" }}"]
          run "bin/engram",
              base:        :homebrew_prefix,
              args:        ["completion", "bash"],
              stdout_path: "{{ "{{HOMEBREW_PREFIX}}" }}/etc/bash_completion.d/engram"
          run "bin/engram",
              base:        :homebrew_prefix,
              args:        ["completion", "zsh"],
              stdout_path: "{{ "{{HOMEBREW_PREFIX}}" }}/share/zsh/site-functions/_engram"
          run "bin/engram",
              base:        :homebrew_prefix,
              args:        ["completion", "fish"],
              stdout_path: "{{ "{{HOMEBREW_PREFIX}}" }}/share/fish/vendor_completions.d/engram.fish"
          mkdir_p "{{ "{{HOMEBREW_PREFIX}}" }}/share/man/man1"
          run "bin/engram",
              base:           :homebrew_prefix,
              args:           ["man", "{{ "{{HOMEBREW_PREFIX}}" }}/share/man/man1"],
              writable_paths: ["{{ "{{HOMEBREW_PREFIX}}" }}/share/man/man1"]
        # Homebrew tracks only the files it installs, so without this an
        # uninstall leaves the completions and man pages behind. One `remove`
        # with no `recursive:` is rm_f on each path and glob match: it never
        # removes a directory, so the shared parent directories stay, and a
        # file it cannot remove (missing, or a permission denial) is left
        # without an error.
        uninstall_steps: |-
          remove [
            "{{ "{{HOMEBREW_PREFIX}}" }}/etc/bash_completion.d/engram",
            "{{ "{{HOMEBREW_PREFIX}}" }}/share/zsh/site-functions/_engram",
            "{{ "{{HOMEBREW_PREFIX}}" }}/share/fish/vendor_completions.d/engram.fish",
            "{{ "{{HOMEBREW_PREFIX}}" }}/share/man/man1/engram.1",
            "{{ "{{HOMEBREW_PREFIX}}" }}/share/man/man1/engram-*.1",
          ]
