# goreleaser configuration — https://goreleaser.com
# Builds the multi-arch image + GitHub release on tag. The OCI Helm chart is
# pushed separately by `task chart:push` in the release workflow.
version: 2

project_name: engram

# No `before.hooks: [go mod tidy]` — release builds must use the exact tagged
# go.mod/go.sum (tag = source of truth). Tidiness is enforced in CI (ci.yaml
# test job: `go mod tidy` + `git diff --exit-code`), not mutated here.

gomod:
  proxy: true

builds:
  - id: engram
    main: ./cmd/engram
    binary: engram
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

dockers:
  - image_templates:
      - "ghcr.io/seanb4t/engram:{{ .Version }}-amd64"
    use: buildx
    dockerfile: Dockerfile.goreleaser
    goos: linux
    goarch: amd64
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
  - image_templates:
      - "ghcr.io/seanb4t/engram:{{ .Version }}-arm64"
    use: buildx
    dockerfile: Dockerfile.goreleaser
    goos: linux
    goarch: arm64
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"

docker_manifests:
  - name_template: "ghcr.io/seanb4t/engram:{{ .Version }}"
    image_templates:
      - "ghcr.io/seanb4t/engram:{{ .Version }}-amd64"
      - "ghcr.io/seanb4t/engram:{{ .Version }}-arm64"
  - name_template: "ghcr.io/seanb4t/engram:latest"
    image_templates:
      - "ghcr.io/seanb4t/engram:{{ .Version }}-amd64"
      - "ghcr.io/seanb4t/engram:{{ .Version }}-arm64"

# No `changelog:` block — release-please owns the changelog (CHANGELOG.md + the
# GitHub Release notes body), derived from Conventional Commits.
release:
  # release-please creates the GitHub Release (changelog body); GoReleaser only
  # uploads artifacts to that already-created, tag-keyed release.
  # replace_existing_artifacts makes re-runs idempotent.
  replace_existing_artifacts: true
