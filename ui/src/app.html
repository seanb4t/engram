<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>engram — operator console</title>
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="%sveltekit.assets%/favicon-32.png" sizes="32x32" />
    <link rel="alternate icon" href="%sveltekit.assets%/favicon-16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <script>
      // Anti-flash: apply persisted/system theme before first paint.
      try {
        const m = localStorage.getItem('mode-watcher-mode') || 'system';
        const dark = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch {}
    </script>
    <script>
      // engram:text-size anti-flash
      // Applies the persisted console text-size preference (D-13) before
      // first paint. Dependency-free by design (this script cannot import
      // ui/src/lib/display.svelte.ts) -- keep its clamp behaviour in sync
      // with that module by hand: integer, round, 12-16, else 15.
      let size = 15;
      try {
        const v = parseInt(localStorage.getItem('engram.console.textSize'), 10);
        size = Number.isFinite(v) ? Math.min(16, Math.max(12, Math.round(v))) : 15;
      } catch {}
      document.documentElement.style.setProperty('--ui-font', size + 'px');
      document.documentElement.dataset.textSize = String(size);
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover"><div>%sveltekit.body%</div></body>
</html>
