apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-mcp
  labels:
    app.kubernetes.io/name: memory-mcp
  {{- with .Values.memory.deploymentAnnotations }}
  # Reloader watches Deployment metadata.annotations (not the pod template).
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: memory-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memory-mcp
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: memory-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { containerPort: 8080, name: http }
          env:
            - { name: MEM_LISTEN_ADDR, value: "{{ .Values.memory.listenAddr }}" }
            - { name: MEM_QDRANT_ADDR, value: "qdrant.{{ .Release.Namespace }}.svc.cluster.local:6334" }
            - { name: MEM_QDRANT_COLLECTION, value: "{{ .Values.memory.qdrant.collection }}" }
            - { name: MEM_LITELLM_URL, value: "{{ .Values.memory.litellm.url }}" }
            - { name: MEM_EMBED_MODEL, value: "{{ .Values.memory.embed.model }}" }
            - { name: MEM_EMBED_DIM, value: "{{ .Values.memory.embed.dim }}" }
            - name: MEM_LITELLM_KEY
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.memory.litellm.keySecret.name }}"
                  key: "{{ .Values.memory.litellm.keySecret.key }}"
            {{- with .Values.memory.oidc.issuer }}
            - { name: MEM_OIDC_ISSUER, value: "{{ . }}" }
            {{- end }}
            {{- with .Values.memory.oidc.audience }}
            - { name: MEM_OIDC_AUDIENCE, value: "{{ . }}" }
            {{- end }}
            {{- with .Values.memory.oidc.resourceMetadata }}
            - { name: MEM_OIDC_RESOURCE_METADATA, value: "{{ . }}" }
            {{- end }}
            - { name: MEM_LOG_LEVEL, value: "{{ .Values.observability.log.level }}" }
            - { name: MEM_LOG_FORMAT, value: "{{ .Values.observability.log.format }}" }
            - { name: MEM_LOG_STDOUT, value: "{{ .Values.observability.log.stdout }}" }
            {{- with .Values.observability.otlpEndpoint }}
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "{{ . }}" }
            {{- end }}
            {{- if and .Values.observability.otlpEndpoint .Values.observability.otlpHeadersSecret.name }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.observability.otlpHeadersSecret.name }}"
                  key: "{{ .Values.observability.otlpHeadersSecret.key }}"
            {{- else if and .Values.observability.otlpEndpoint .Values.observability.otlpHeaders }}
            - { name: OTEL_EXPORTER_OTLP_HEADERS, value: "{{ .Values.observability.otlpHeaders }}" }
            {{- end }}
            {{- if and .Values.observability.otlpEndpoint .Values.observability.otlpInsecure }}
            - { name: OTEL_EXPORTER_OTLP_INSECURE, value: "true" }
            {{- end }}
            {{- with .Values.observability.resourceAttributes }}
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "{{ . }}" }
            {{- end }}
            {{- if .Values.memory.litellm.caBundle.configMapName }}
            # Go's crypto/x509 loads SSL_CERT_FILE instead of system roots —
            # the mounted bundle must cover every TLS peer of this process.
            - { name: SSL_CERT_FILE, value: "/etc/ssl/ca-bundle/{{ .Values.memory.litellm.caBundle.key }}" }
            {{- end }}
          {{- if .Values.memory.litellm.caBundle.configMapName }}
          volumeMounts:
            - name: ca-bundle
              mountPath: /etc/ssl/ca-bundle
              readOnly: true
          {{- end }}
          resources: {{ toYaml .Values.memory.resources | nindent 12 }}
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
      {{- if .Values.memory.litellm.caBundle.configMapName }}
      volumes:
        - name: ca-bundle
          configMap:
            name: "{{ .Values.memory.litellm.caBundle.configMapName }}"
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: memory-mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: memory-mcp
  ports:
    - { name: http, port: 8080, targetPort: http }
