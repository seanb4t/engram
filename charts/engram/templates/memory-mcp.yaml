apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-mcp
  labels:
    app.kubernetes.io/name: memory-mcp
  {{- with .Values.memory.deploymentAnnotations }}
  # Reloader watches Deployment metadata.annotations (not the pod template).
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: memory-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memory-mcp
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: memory-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { containerPort: 8080, name: http }
          env:
            - { name: MEM_LISTEN_ADDR, value: "{{ .Values.memory.listenAddr }}" }
            - { name: MEM_QDRANT_ADDR, value: "qdrant.{{ .Release.Namespace }}.svc.cluster.local:6334" }
            - { name: MEM_QDRANT_COLLECTION, value: "{{ .Values.memory.qdrant.collection }}" }
            - { name: MEM_LITELLM_URL, value: "{{ .Values.memory.litellm.url }}" }
            - { name: MEM_EMBED_MODEL, value: "{{ .Values.memory.embed.model }}" }
            - { name: MEM_EMBED_DIM, value: "{{ .Values.memory.embed.dim }}" }
            - name: MEM_LITELLM_KEY
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.memory.litellm.keySecret.name }}"
                  key: "{{ .Values.memory.litellm.keySecret.key }}"
            {{- with .Values.memory.oidc.issuer }}
            - { name: MEM_OIDC_ISSUER, value: "{{ . }}" }
            {{- end }}
            {{- with .Values.memory.oidc.audience }}
            - { name: MEM_OIDC_AUDIENCE, value: "{{ . }}" }
            {{- end }}
            {{- with .Values.memory.oidc.resourceMetadata }}
            - { name: MEM_OIDC_RESOURCE_METADATA, value: "{{ . }}" }
            {{- end }}
            {{- with .Values.memory.oidc.clientID }}
            - { name: MEM_OIDC_CLIENT_ID, value: "{{ . }}" }
            {{- end }}
            {{- if .Values.memory.oidc.clientSecret.name }}
            - name: MEM_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.memory.oidc.clientSecret.name }}"
                  key: "{{ .Values.memory.oidc.clientSecret.key }}"
            {{- end }}
            {{- if ne (.Values.memory.ui.enabled | toString) "" }}
            # Tri-state: "" omits (headless-if-creds), "false" is a hard
            # off-switch — both "true" and "false" must reach the binary, so
            # gate on non-empty rather than truthiness (toString tolerates a
            # YAML bool from --set).
            - { name: MEM_UI_ENABLED, value: "{{ .Values.memory.ui.enabled }}" }
            {{- end }}
            {{- with .Values.memory.ui.redirectURL }}
            - { name: MEM_UI_REDIRECT_URL, value: "{{ . }}" }
            {{- end }}
            {{- if .Values.memory.ui.cookieKeySecret.name }}
            - name: MEM_UI_COOKIE_KEY
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.memory.ui.cookieKeySecret.name }}"
                  key: "{{ .Values.memory.ui.cookieKeySecret.key }}"
            {{- end }}
            - { name: MEM_LOG_LEVEL, value: "{{ .Values.observability.log.level }}" }
            - { name: MEM_LOG_FORMAT, value: "{{ .Values.observability.log.format }}" }
            - { name: MEM_LOG_STDOUT, value: "{{ .Values.observability.log.stdout }}" }
            {{- with .Values.observability.otlpEndpoint }}
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "{{ . }}" }
            {{- end }}
            {{- if and .Values.observability.otlpEndpoint .Values.observability.otlpHeadersSecret.name }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.observability.otlpHeadersSecret.name }}"
                  key: "{{ .Values.observability.otlpHeadersSecret.key }}"
            {{- else if and .Values.observability.otlpEndpoint .Values.observability.otlpHeaders }}
            - { name: OTEL_EXPORTER_OTLP_HEADERS, value: "{{ .Values.observability.otlpHeaders }}" }
            {{- end }}
            {{- if and .Values.observability.otlpEndpoint .Values.observability.otlpInsecure }}
            - { name: OTEL_EXPORTER_OTLP_INSECURE, value: "true" }
            {{- end }}
            {{- if and .Values.observability.otlpEndpoint .Values.observability.traces.sampler }}
            - { name: OTEL_TRACES_SAMPLER, value: "{{ .Values.observability.traces.sampler }}" }
            {{- end }}
            {{- if and .Values.observability.otlpEndpoint .Values.observability.traces.samplerArg }}
            - { name: OTEL_TRACES_SAMPLER_ARG, value: "{{ .Values.observability.traces.samplerArg }}" }
            {{- end }}
            {{- if and .Values.observability.otlpEndpoint .Values.observability.metrics.exportInterval }}
            - { name: OTEL_METRIC_EXPORT_INTERVAL, value: "{{ .Values.observability.metrics.exportInterval }}" }
            {{- end }}
            # Pod identity via the Downward API, folded into OTEL_RESOURCE_ATTRIBUTES.
            # WithFromEnv() in the binary consumes these; same image works on a
            # laptop, in Docker, and in k8s (orchestrator supplies its own identity).
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: POD_UID
              valueFrom: { fieldRef: { fieldPath: metadata.uid } }
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME),k8s.pod.uid=$(POD_UID){{ with .Values.observability.resourceAttributes }},{{ . }}{{ end }}"
            {{- if .Values.memory.litellm.caBundle.configMapName }}
            # Go's crypto/x509 loads SSL_CERT_FILE instead of system roots —
            # the mounted bundle must cover every TLS peer of this process.
            - { name: SSL_CERT_FILE, value: "/etc/ssl/ca-bundle/{{ .Values.memory.litellm.caBundle.key }}" }
            {{- end }}
          {{- if .Values.memory.litellm.caBundle.configMapName }}
          volumeMounts:
            - name: ca-bundle
              mountPath: /etc/ssl/ca-bundle
              readOnly: true
          {{- end }}
          resources: {{ toYaml .Values.memory.resources | nindent 12 }}
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
      {{- if .Values.memory.litellm.caBundle.configMapName }}
      volumes:
        - name: ca-bundle
          configMap:
            name: "{{ .Values.memory.litellm.caBundle.configMapName }}"
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: memory-mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: memory-mcp
  ports:
    - { name: http, port: 8080, targetPort: http }
