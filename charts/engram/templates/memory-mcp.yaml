apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-mcp
  labels:
    app.kubernetes.io/name: memory-mcp
  {{- with .Values.memory.deploymentAnnotations }}
  # Reloader watches Deployment metadata.annotations (not the pod template).
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: memory-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memory-mcp
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: memory-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { containerPort: 8080, name: http }
          env: {{- include "engram.containerEnv" . | nindent 12 }}
          {{- if .Values.memory.openai.caBundle.configMapName }}
          volumeMounts:
            - name: ca-bundle
              mountPath: /etc/ssl/ca-bundle
              readOnly: true
          {{- end }}
          resources: {{ toYaml .Values.memory.resources | nindent 12 }}
          {{- $schemaTimeout := int .Values.memory.qdrant.schemaTimeoutSeconds }}
          {{- if le $schemaTimeout 0 }}
          {{- fail "memory.qdrant.schemaTimeoutSeconds must be a positive number of seconds" }}
          {{- end }}
          {{- /* The server opens its port only after provisioning its
                 collection: a 15 s connect-and-create budget plus the schema
                 budget. The window covers both plus 15 s for process start,
                 rounded up to the 5 s period; liveness and readiness start only
                 once it passes. */}}
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
            failureThreshold: {{ div (add $schemaTimeout 34) 5 }}
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
      {{- if .Values.memory.openai.caBundle.configMapName }}
      volumes:
        - name: ca-bundle
          configMap:
            name: "{{ .Values.memory.openai.caBundle.configMapName }}"
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: memory-mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: memory-mcp
  ports:
    - { name: http, port: 8080, targetPort: http }
