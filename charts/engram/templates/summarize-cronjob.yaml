{{- if .Values.memory.summarize.cronjob.enabled }}
{{- $cronjob := .Values.memory.summarize.cronjob }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: memory-mcp-summarize
spec:
  schedule: {{ $cronjob.schedule | quote }}
  concurrencyPolicy: {{ $cronjob.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ $cronjob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ $cronjob.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ $cronjob.backoffLimit }}
      activeDeadlineSeconds: {{ $cronjob.activeDeadlineSeconds }}
      template:
        spec:
          restartPolicy: {{ $cronjob.restartPolicy }}
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets: {{ toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: summarize-missing
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              {{- /* The image entrypoint is "/engram serve". Without this command
                     the pod runs "/engram serve summarize-missing", which fails. */}}
              command: ["/engram"]
              args: ["summarize-missing", "--all-scopes", "--timeout", {{ $cronjob.timeout | quote }}]
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532 # the nonroot user of the distroless base image
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env: {{- include "engram.containerEnv" . | nindent 16 }}
              resources: {{ toYaml $cronjob.resources | nindent 16 }}
              {{- if .Values.memory.openai.caBundle.configMapName }}
              volumeMounts:
                - name: ca-bundle
                  mountPath: /etc/ssl/ca-bundle
                  readOnly: true
              {{- end }}
          {{- if .Values.memory.openai.caBundle.configMapName }}
          volumes:
            - name: ca-bundle
              configMap:
                name: "{{ .Values.memory.openai.caBundle.configMapName }}"
          {{- end }}
{{- end }}
