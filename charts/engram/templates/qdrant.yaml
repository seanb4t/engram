apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.qdrant.storage.pvcName }} # = qdrant-data (data-safety invariant)
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.qdrant.storage.className }}
  resources:
    requests:
      storage: {{ .Values.qdrant.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  labels:
    app.kubernetes.io/name: qdrant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant
    spec:
      containers:
        - name: qdrant
          image: {{ .Values.qdrant.image }}
          ports:
            - { containerPort: 6333, name: rest }
            - { containerPort: 6334, name: grpc }
          livenessProbe:
            httpGet: { path: /livez, port: rest }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: rest }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /qdrant/storage }
          resources: {{ toYaml .Values.qdrant.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.qdrant.storage.pvcName }}
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: qdrant
  ports:
    - { name: rest, port: 6333, targetPort: rest }
    - { name: grpc, port: 6334, targetPort: grpc }
