# engram Helm chart values.
# Defaults mirror the live deployment so an existing install is ADOPTED (same
# resource kind/name/namespace) rather than recreated. The cluster supplies
# environment specifics (embedder URL, OIDC issuer, secret refs) via valuesObject.

image:
  repository: ghcr.io/seanb4t/engram
  tag: "" # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# e.g. [{ name: ghcr-pull-secret }] — the cluster sets this for a private image.
imagePullSecrets: []

memory:
  listenAddr: ":8080"
  # ENGRAM_MCP_PATH: where the MCP transport is mounted. "" → /mcp (default, both
  # headless and UI modes). "/" restores the pre-0.7 root catch-all (MCP answers
  # every path) for clients that still POST to the host root. When the UI is on
  # and this is the default, the host root serves the console.
  mcpPath: ""
  embed:
    model: "ollama/bge-m3"
    dim: 1024
  openai:
    baseURL: "" # cluster supplies, e.g. http://embeddings.internal:4000
    apiKeySecret:
      name: "" # Secret holding the embedder API key
      key: ""
    # Internal-CA trust for the embedder client (mirrors octopus's
    # NODE_EXTRA_CA_CERTS pattern, but via SSL_CERT_FILE which Go honors).
    # When configMapName is set, the ConfigMap is mounted read-only and
    # SSL_CERT_FILE points at the bundle. NOTE: Go loads SSL_CERT_FILE
    # INSTEAD OF the system roots, so the bundle must contain every CA the
    # process needs (the embedder, OIDC issuer, OTLP-over-TLS, ...). The cluster
    # supplies e.g. configMapName: fzymgc-ica1-ca (already distributed to
    # the agent-memory namespace).
    caBundle:
      configMapName: ""
      key: ca.crt # key inside the ConfigMap holding the PEM bundle
  # Auto-summary for curated memories. Empty model = disabled (recall returns
  # only client-authored summaries). When set, the server digests memories that
  # lack a summary using this chat model, served by the SAME OpenAI-compatible
  # endpoint as the embedder (memory.openai.baseURL + apiKeySecret). maxChars
  # caps generated-summary length and is also the recall-truncation cap.
  # Prefer a NON-reasoning model here: this is a tight-token, one-line task, and
  # reasoning models burn the token budget on hidden reasoning. If you must use a
  # reasoning model, raise maxTokens (it only bounds generation; the summary is
  # still truncated to maxChars).
  summarize:
    model: "" # ENGRAM_SUMMARY_MODEL, e.g. "gpt-4o-mini"; empty disables auto-summary
    maxChars: 280 # ENGRAM_SUMMARY_MAX_CHARS
    maxTokens: 1024 # ENGRAM_SUMMARY_MAX_TOKENS; generation ceiling (0 = gateway default). Raise for reasoning models.
    timeout: 30s # ENGRAM_SUMMARY_TIMEOUT; per-request HTTP timeout (0 = none)
  qdrant:
    collection: "memory"
  oidc:
    issuer: "" # set → enables bearer-token enforcement (signature/issuer/expiry)
    audience: "" # ENGRAM_OIDC_AUDIENCE (optional aud pin)
    resourceMetadata: "" # ENGRAM_OIDC_RESOURCE_METADATA (optional)
    # ENGRAM_OWNER_CLAIM: OIDC claim whose value becomes the record owner (authz
    # key). Empty → engram defaults to "email". Set to e.g. "sub" to use the
    # stable subject claim instead (never changes with IdP profile updates, but
    # harder to read in stored records). Changing this claim after records are
    # written requires migrate-remap-owner and forces a web-console re-login.
    ownerClaim: ""
    # Web-UI confidential-client credentials. Consumed only when the UI lane is
    # on (memory.ui below). clientID is plain; the client secret is secret-backed
    # via secretKeyRef (cluster supplies the Secret).
    clientID: "" # ENGRAM_OIDC_CLIENT_ID
    clientSecret:
      name: "" # Secret holding the OIDC client secret (ENGRAM_OIDC_CLIENT_SECRET)
      key: ""
  # Web-UI / operator-console lane (cookie/OIDC observe auth). enabled: "" =
  # headless unless full creds are present; "true" forces it on (fails fast on
  # missing creds); "false" is a hard off-switch. The cookie-seal key is a
  # 32-byte AES-256 key, secret-backed via secretKeyRef.
  ui:
    enabled: "" # ENGRAM_UI_ENABLED: "" | "true" | "false"
    # ENGRAM_UI_ISSUER: OIDC issuer for the console login lane, decoupled from the
    # MCP bearer issuer (memory.oidc.issuer). Set it when the console is a
    # separate OIDC app (distinct iss) from the agents' bearer app — e.g.
    # Authentik's per-application issuers. Empty → defaults to
    # memory.oidc.issuer (single-app deployments need nothing here).
    issuer: ""
    redirectURL: "" # ENGRAM_UI_REDIRECT_URL, e.g. https://engram.example/auth/callback
    cookieKeySecret:
      name: "" # Secret holding the AES-256 cookie key (ENGRAM_UI_COOKIE_KEY)
      key: ""
  # Reloader watches the DEPLOYMENT object's annotations (not the pod template).
  # The cluster sets { reloader.stakater.com/auto: "true" }.
  deploymentAnnotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# External entrypoint for the memory-mcp Service (:8080). Off by default —
# the Service stays ClusterIP and the chart creates no Ingress/Route. Pick ONE
# mode; both route the WHOLE service at host root (the operator console at /ui
# also needs /auth/* and the Connect API, all on :8080), so reach the console
# at https://<host>/ui. The UI lane must also be enabled (memory.ui above).
expose:
  mode: none # none | ingress | httproute
  host: "" # external hostname; required when mode != none
  # mode: ingress → networking.k8s.io/v1 Ingress
  ingress:
    className: "" # IngressClass (empty = cluster default)
    path: /
    pathType: Prefix # Prefix | Exact | ImplementationSpecific
    tls:
      secretName: "" # TLS cert Secret for host; empty = no TLS block
    # Extra labels/annotations merged onto the Ingress (annotations are where
    # controller config lives, e.g. cert-manager.io/cluster-issuer,
    # nginx.ingress.kubernetes.io/*).
    labels: {}
    annotations: {}
  # mode: httproute → gateway.networking.k8s.io/v1 HTTPRoute (attaches to an
  # EXISTING Gateway you reference here; the chart does NOT create a Gateway).
  httproute:
    parentRefs: [] # required: [{ name: <gateway>, namespace: <ns>, sectionName: <listener> }]
    path: / # PathPrefix match value
    # Extra labels/annotations merged onto the HTTPRoute.
    labels: {}
    annotations: {}

observability:
  # OTLP collector endpoint (host:port). Empty disables telemetry export.
  otlpEndpoint: ""
  # OTLP request headers, e.g. "Authorization=Bearer <token>". Only sent when
  # otlpEndpoint is set. Empty disables the header. Plain value — visible in
  # the pod spec; prefer otlpHeadersSecret for bearer tokens.
  otlpHeaders: ""
  # Secret-backed OTLP headers (full header string in the Secret value, e.g.
  # "Authorization=Bearer <token>"). Takes precedence over otlpHeaders; only
  # emitted when otlpEndpoint is set. The cluster supplies the HyperDX ingest
  # bearer here (Vault fzymgc-house/cluster/clickstack property
  # otel_ingest_api_key; ESO pattern as in monitoring-otel-scraper).
  otlpHeadersSecret:
    name: "" # Secret holding the OTLP headers string
    key: ""
  # Use plaintext (no TLS) for the OTLP exporter. Default true = in-cluster
  # plaintext collector; set false for TLS using system roots.
  # Only emitted when otlpEndpoint is also set.
  otlpInsecure: true
  # Extra OTel resource attributes, e.g. "deployment.environment=prod".
  resourceAttributes: ""
  # Trace sampling. Empty => SDK default (parent-based always-on). Standard OTel
  # values: always_on | always_off | traceidratio | parentbased_traceidratio.
  # Only emitted when otlpEndpoint is set.
  traces:
    sampler: "" # OTEL_TRACES_SAMPLER
    samplerArg: "" # OTEL_TRACES_SAMPLER_ARG, e.g. "0.1" for 10% with traceidratio
  # Metric export cadence. Empty => SDK default (60000ms). Only emitted when
  # otlpEndpoint is set.
  metrics:
    exportInterval: "" # OTEL_METRIC_EXPORT_INTERVAL in milliseconds
  log:
    level: info # debug|info|warn|error
    format: json # json|text
    stdout: true # also write logs to stdout

qdrant:
  image: qdrant/qdrant:v1.18.2@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c
  storage:
    size: 5Gi
    className: longhorn-encrypted
    pvcName: qdrant-data # MUST match the live PVC for ArgoCD to adopt it
    # Custom annotations on the PVC (empty by default — the chart stays generic).
    # The cluster supplies deletion-protection here, e.g. via valuesObject:
    #   helm.sh/resource-policy: keep            # guards `helm uninstall`
    #   argocd.argoproj.io/sync-options: Prune=false  # guards ArgoCD prune
    # Without protection, an ArgoCD source-ownership transition (kustomize→helm)
    # prunes+recreates the PVC and loses the data.
    annotations: {}
  # Match the live deployment exactly (else OOMKill on cutover).
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  # Optional native S3 snapshot storage. Off by default (generic chart). When
  # enabled, Qdrant writes app-consistent .snapshot files straight to an
  # S3-compatible bucket; snapshots_path doubles as the object-key prefix.
  # The cluster supplies bucket/endpoint/secret via valuesObject; access/secret
  # keys come from an existing Secret (not chart-managed).
  snapshots:
    s3:
      enabled: false
      bucket: ""
      region: "auto" # R2 ignores region; "auto" satisfies the S3 client
      endpointUrl: "" # e.g. https://<account>.r2.cloudflarestorage.com
      pathPrefix: "memory/qdrant-snapshots" # S3 key prefix (snapshots_path)
      secret:
        name: "" # Secret holding the S3 access/secret keys
        accessKeyKey: access_key
        secretKeyKey: secret_key
