syntax = "proto3";

package engram.v1;

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "buf/validate/validate.proto";

// A single memory record (mirrors internal/store.Memory's readable fields).
message Memory {
  string id = 1;
  string content = 2;
  string scope = 3;
  string repo = 4;
  string workspace = 5;
  string worktree = 6;
  string base_dir = 7;
  string source = 8;
  string category = 9;
  repeated string tags = 10;
  string actor = 11;
  string owner = 12;
  string visibility = 13;
  google.protobuf.Timestamp created_at = 14;
  string summary = 15;
  string summary_source = 16;
  // Qdrant similarity score on search results (higher = closer); 0 on
  // list/get results, which are not ranked.
  float score = 17;
  string short_id = 18;
  // Monotonic count of strong-signal touches (get-by-id + update).
  uint64 access_count = 19;
  // Recency of the last strong-signal touch.
  google.protobuf.Timestamp last_accessed_at = 20;
  // Discovery-only fields; empty on plain memories (never set by
  // store_memory/schedule_memory, only by store_discovery).
  string kind = 21;
  repeated Citation citations = 22;
  // A superseded record is soft-hidden from recall but stays fetchable by
  // id. Unset means not superseded, not superseding anything.
  optional string superseded_by = 23;
  repeated string supersedes = 24;
  google.protobuf.Timestamp not_before = 25;
  google.protobuf.Timestamp not_after = 26;
  google.protobuf.Timestamp archived_at = 27;
  // Explicit presence; the server always sets this, including to zero for a
  // v0 record, which is what keeps the key in every rendered JSON document.
  // An unset value on the wire is a server bug, never a v0 record.
  optional uint32 schema_version = 28;
  // Explicit presence and always set; empty string means no auto summary
  // was produced. Unset on the wire is a server bug.
  optional string summary_model = 29;
  // Unset means never egressed.
  google.protobuf.Timestamp summary_egress_at = 30;
}

message ScopeCount {
  string scope = 1;
  uint64 count = 2;
}

message ListScopesRequest {}
message ListScopesResponse {
  repeated ScopeCount scopes = 1;
  bool approximate = 2; // true when the scan hit the scanCap ceiling
}

message ListMemoriesRequest {
  string scope = 1;
  uint64 limit = 2;
  uint64 offset = 3;
  repeated string categories = 4; // empty = all categories
  string visibility = 5;          // "" = all | "private" | "shared"
  repeated string tags = 6;       // empty = all; non-empty = records carrying ALL listed tags (AND)
  bool full = 7;                  // false (default) returns summary-shaped memories (content cleared); true returns full content
  string created_after = 8;       // RFC3339; inclusive lower bound on created_at
  string created_before = 9;      // RFC3339; exclusive upper bound on created_at
  string page_token = 10;         // opaque cursor; when set, cursor paging (ignores offset)
  // engram:rule:start paging-trio-mutually-exclusive
  // cursor_mode, offset, and page_token are mutually exclusive
  // engram:rule:end paging-trio-mutually-exclusive
  bool cursor_mode = 11;          // opt into cursor paging on the first (tokenless) page; default false = offset-for-UI (ADR engram-1frj). Mutually exclusive with offset>0.
  // cross_spine spans every scope the caller is authorized to read, ignoring
  // `scope` entirely when true.
  // engram:rule:start scope-required-unless-cross-spine
  // scope is required unless cross_spine is true
  // engram:rule:end scope-required-unless-cross-spine
  bool cross_spine = 12;
  // false (default) reproduces today's soft-hidden behavior: archived
  // records stay unreachable. true relaxes exactly the `archived_at`
  // IsEmpty recall condition in Store.List, revealing archived records
  // without narrowing the result set to only-archived ones.
  bool include_archived = 13;
}

message ListMemoriesResponse {
  repeated Memory memories = 1;
  uint64 total = 2;
  bool approximate = 3 [deprecated = true]; // always false since totals are now exact (Count)
  string next_page_token = 4;               // empty when no further pages (cursor paging)
  // searched_scopes names the scopes the caller is AUTHORIZED to read — the
  // span a cross_spine query covered — NOT the scopes that produced hits.
  // Present only when the request set cross_spine=true; absent (proto3
  // default) on a scope-confined response.
  repeated string searched_scopes = 5;
  // scopes_truncated is true when the searched_scopes enumeration hit its
  // bounded-sample ceiling, so the list may be incomplete. Present only
  // alongside searched_scopes on a cross_spine response.
  bool scopes_truncated = 6;
}

message SearchMemoriesRequest {
  string query = 1;
  string scope = 2;
  uint64 k = 3;
  repeated string tags = 4; // empty = all; non-empty = records carrying ALL listed tags (AND)
  bool full = 5;            // false (default) returns summary-shaped memories (content cleared); true returns full content
  string created_after = 6;  // RFC3339; inclusive lower bound on created_at
  string created_before = 7; // RFC3339; exclusive upper bound on created_at
  repeated string categories = 8; // empty = all categories; non-empty = records in ANY listed category (OR)
  // cross_spine spans every scope the caller is authorized to read, ignoring
  // `scope` entirely when true.
  // engram:rule:start scope-required-unless-cross-spine
  // scope is required unless cross_spine is true
  // engram:rule:end scope-required-unless-cross-spine
  bool cross_spine = 9;
}
message SearchMemoriesResponse {
  repeated Memory memories = 1;
  // searched_scopes names the scopes the caller is AUTHORIZED to read — the
  // span a cross_spine query covered — NOT the scopes that produced hits.
  // Present only when the request set cross_spine=true; absent (proto3
  // default) on a scope-confined response.
  repeated string searched_scopes = 2;
  // scopes_truncated is true when the searched_scopes enumeration hit its
  // bounded-sample ceiling, so the list may be incomplete. Present only
  // alongside searched_scopes on a cross_spine response.
  bool scopes_truncated = 3;
}

message GetMemoryRequest { string id = 1; }
message GetMemoryResponse { Memory memory = 1; }

message SearchDiscoveriesRequest {
  string query = 1;
  string scope = 2;
  uint64 k = 3;
}
message SearchDiscoveriesResponse { repeated Memory discoveries = 1; }

// --- write RPC messages (additive, this phase — stubs only; Phase 17 wires handlers) ---

// Visibility mirrors the Memory.visibility string enum ("private"/"shared") as a
// typed enum for SetVisibility (D-07); the zero value is rejected by buf.validate
// so a caller cannot silently no-op a visibility change.
enum Visibility {
  VISIBILITY_UNSPECIFIED = 0;
  VISIBILITY_PRIVATE = 1;
  VISIBILITY_SHARED = 2;
}

message StoreMemoryRequest {
  string content = 1 [(buf.validate.field).string.min_len = 1];
  string scope = 2 [(buf.validate.field).string.min_len = 1];
  string source = 3;
  string category = 4 [(buf.validate.field).string = {in: ["decision", "preference", "convention", "gotcha"]}];
  repeated string tags = 5;
  string repo = 6;
  string workspace = 7;
  string worktree = 8;
  string base_dir = 9;
  string summary = 10;
}
message StoreMemoryResponse {
  string id = 1;
  string short_id = 2;
}

// Citation mirrors internal/server/tools.go's citationArg (a store_discovery source anchor).
message Citation {
  string kind = 1 [(buf.validate.field).string = {in: ["file", "commit", "url", "repo"]}];
  string ref = 2 [(buf.validate.field).string.min_len = 1];
  string locator = 3;
  string pin = 4;
  string excerpt = 5 [(buf.validate.field).string.max_bytes = 16384];
}

message StoreDiscoveryRequest {
  string content = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 65536
  }];
  string kind = 2 [(buf.validate.field).string = {in: ["map", "fact"]}];
  repeated Citation citations = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 50
  }];
  string scope = 4 [(buf.validate.field).string.prefix = "discovery:"];
  repeated string tags = 5;
  string summary = 6;
  string id = 7; // optional; supply to replace an existing discovery in place
}
message StoreDiscoveryResponse {
  string id = 1;
  string short_id = 2;
}

// UpdateMemoryRequest.update_mask is the sole presence mechanism (D-01/D-02): no
// proto3 `optional` keyword is used on content/shared/tags/summary. This phase
// enforces the mask's STRUCTURE only — presence (field rule below), non-empty
// paths, and an allowlist of {content, shared, tags, summary} (message-level CEL
// below) — via the Plan 03 protovalidate interceptor. `content`, `shared`, `tags`,
// and `summary` are each independently updatable via their own mask path. Only a
// shared-only and/or summary-only update (neither `content` nor `tags` in the
// mask) skips the re-embed and routes to a payload-only, vector-preserving store
// write — a `tags`-only update DOES re-embed, because tags are folded into the
// embedded document text (store.EmbedText) alongside content, so a tag change
// changes what was embedded (17-02 landmine 2/round-2 review MEDIUM reconcile
// item 6). The SEMANTIC application of the mask (the deps/store partial-update
// path that actually updates only the named fields, plus DEC-ddiw summary
// reconciliation) is Phase 17 scope.
message UpdateMemoryRequest {
  option (buf.validate.message).cel = {
    id: "update_memory.mask"
    message: "update_mask must contain at least one path, each of: content, shared, tags, summary"
    expression: "has(this.update_mask) && size(this.update_mask.paths) > 0 && this.update_mask.paths.all(p, p in ['content', 'shared', 'tags', 'summary'])"
  };
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string content = 2;
  bool shared = 3;
  repeated string tags = 4;
  string summary = 5;
  google.protobuf.FieldMask update_mask = 6 [(buf.validate.field).required = true];
}
message UpdateMemoryResponse {
  string id = 1;
  string short_id = 2;
}

message DeleteMemoryRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}
message DeleteMemoryResponse {}

message SetVisibilityRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  Visibility visibility = 2 [(buf.validate.field).enum = {not_in: [0]}];
}
message SetVisibilityResponse {
  string id = 1;
  string short_id = 2;
}

// ScheduleMemoryRequest is FLATTENED (D-05: no nested StoreMemoryRequest) — it
// duplicates the StoreMemoryRequest fields inline plus the typed temporal window
// (D-06). The message-level CEL below mirrors parseWindow's two SHAPE rules (at
// least one bound set; not_after strictly after not_before when both are set).
// It deliberately does NOT encode "not_after must be in the future" — that rule
// is wall-clock/time-of-check dependent and is left to the Phase 17 handler,
// matching parseWindow's own split between shape and clock validation.
message ScheduleMemoryRequest {
  option (buf.validate.message).cel = {
    id: "schedule_memory.window"
    message: "schedule_memory requires not_before and/or not_after, and not_after must be strictly after not_before when both are set"
    expression: "(has(this.not_before) || has(this.not_after)) && (!has(this.not_before) || !has(this.not_after) || this.not_after > this.not_before)"
  };
  string content = 1 [(buf.validate.field).string.min_len = 1];
  string scope = 2 [(buf.validate.field).string.min_len = 1];
  string source = 3;
  // engram:rule:start discovery-not-schedulable
  // discovery is not schedulable; use store_discovery
  // engram:rule:end discovery-not-schedulable
  string category = 4 [(buf.validate.field).string = {in: ["decision", "preference", "convention", "gotcha"]}];
  repeated string tags = 5;
  string repo = 6;
  string workspace = 7;
  string worktree = 8;
  string base_dir = 9;
  string summary = 10;
  // engram:rule:start schedule-window-at-least-one-bound
  // schedule_memory requires not_before and/or not_after (use store_memory for unscheduled records)
  // engram:rule:end schedule-window-at-least-one-bound
  // engram:rule:start window-not-before-before-not-after
  // not_before must be strictly before not_after
  // engram:rule:end window-not-before-before-not-after
  google.protobuf.Timestamp not_before = 11;
  google.protobuf.Timestamp not_after = 12;
}
message ScheduleMemoryResponse {
  string id = 1;
  string short_id = 2;
}

service EngramService {
  rpc ListScopes(ListScopesRequest) returns (ListScopesResponse);
  rpc ListMemories(ListMemoriesRequest) returns (ListMemoriesResponse);
  rpc SearchMemories(SearchMemoriesRequest) returns (SearchMemoriesResponse);
  rpc GetMemory(GetMemoryRequest) returns (GetMemoryResponse);
  rpc SearchDiscoveries(SearchDiscoveriesRequest) returns (SearchDiscoveriesResponse);
  // --- new write RPCs (additive, this phase — stubs only) ---
  rpc StoreMemory(StoreMemoryRequest) returns (StoreMemoryResponse);
  rpc StoreDiscovery(StoreDiscoveryRequest) returns (StoreDiscoveryResponse);
  rpc UpdateMemory(UpdateMemoryRequest) returns (UpdateMemoryResponse);
  rpc DeleteMemory(DeleteMemoryRequest) returns (DeleteMemoryResponse);
  rpc SetVisibility(SetVisibilityRequest) returns (SetVisibilityResponse);
  rpc ScheduleMemory(ScheduleMemoryRequest) returns (ScheduleMemoryResponse);
}
