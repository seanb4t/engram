allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
overrides:
  # Force esbuild >=0.28.1 to clear GHSA-gv7w-rqvm-qjhr (build-time RCE via a
  # malicious NPM_CONFIG_REGISTRY in esbuild's Deno module). esbuild is pulled
  # in transitively at 0.27.x: vite caps it at ^0.27.0 (via astro), and
  # wrangler 4.101.0 pins esbuild 0.27.3.
  esbuild: ^0.28.1
  # Force undici >=7.28.0 to clear GHSA-hm92-r4w5-c3mj (cross-origin request
  # routing via SOCKS5 proxy pool reuse) and GHSA-vmh5-mc38-953g (TLS cert
  # validation bypass via SOCKS5 ProxyAgent); both HIGH, both patched in 7.28.0.
  # undici is pulled in transitively at 7.24.8 by wrangler/miniflare. Pin the
  # 7.x patched line via caret, not the bare >=7.28.0 from the advisory (which
  # would resolve to undici 8.x and major-bump wrangler's runtime).
  undici: ^8.0.0
minimumReleaseAgeExclude:
  - '@astrojs/starlight@0.40.0'
  - '@expressive-code/core@0.43.1'
  - '@expressive-code/plugin-frames@0.43.1'
  - '@expressive-code/plugin-shiki@0.43.1'
  - '@expressive-code/plugin-text-markers@0.43.1'
  - astro-expressive-code@0.43.1
  - astro@6.4.8
  - expressive-code@0.43.1
  - rehype-expressive-code@0.43.1
