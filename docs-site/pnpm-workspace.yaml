allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
overrides:
  # Force esbuild >=0.28.1 to clear GHSA-gv7w-rqvm-qjhr (build-time RCE via a
  # malicious NPM_CONFIG_REGISTRY in esbuild's Deno module). esbuild is pulled
  # in transitively at 0.27.x: vite caps it at ^0.27.0 (via astro), and
  # wrangler 4.101.0 pins esbuild 0.27.3.
  esbuild: ^0.28.1
  # Force undici to a patched release, clearing two HIGH SOCKS5 advisories:
  # GHSA-hm92-r4w5-c3mj (cross-origin request routing via proxy pool reuse) and
  # GHSA-vmh5-mc38-953g (TLS cert-validation bypass via SOCKS5 ProxyAgent).
  # undici is transitive via wrangler/miniflare. Patched lines: 7.28.0 on 7.x,
  # 8.2.0 / 8.5.0 on 8.x; the floor below sits at the 8.x patched release so the
  # override can never resolve to a vulnerable version. (Keep the rationale, not
  # a major-version preference, here — Renovate rewrites the value, not this
  # comment.)
  undici: ^8.5.0
minimumReleaseAgeExclude:
  - '@astrojs/starlight@0.40.0'
  - '@expressive-code/core@0.43.1'
  - '@expressive-code/plugin-frames@0.43.1'
  - '@expressive-code/plugin-shiki@0.43.1'
  - '@expressive-code/plugin-text-markers@0.43.1'
  - astro-expressive-code@0.43.1
  - astro@6.4.8
  - expressive-code@0.43.1
  - rehype-expressive-code@0.43.1
