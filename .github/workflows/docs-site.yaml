# SPDX-License-Identifier: Apache-2.0
name: docs-site

on:
  push:
    branches:
      - main
    paths:
      - "docs-site/**"
      - ".github/workflows/docs-site.yaml"
  pull_request:
    paths:
      - "docs-site/**"
      - ".github/workflows/docs-site.yaml"

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      # `uses:` steps ignore defaults.run.working-directory, so point
      # action-setup at the docs-site packageManager field explicitly.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: docs-site/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Promote the built+tested dist to the deploy job — deploy never rebuilds,
      # so the deployed artifact is byte-identical to the one verified here.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-site-dist
          path: docs-site/dist
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs-site
    steps:
      # Checkout supplies wrangler.jsonc; dist comes from the build job's
      # artifact (not a rebuild), so tested == deployed.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docs-site-dist
          path: docs-site/dist
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs-site
          command: deploy
