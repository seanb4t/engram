# SPDX-License-Identifier: Apache-2.0
name: docs-site

on:
  push:
    branches:
      - main
    paths:
      - "docs-site/**"
      - ".github/workflows/docs-site.yaml"
  pull_request:
    paths:
      - "docs-site/**"
      - ".github/workflows/docs-site.yaml"

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      # `uses:` steps ignore defaults.run.working-directory, so point
      # action-setup at the docs-site packageManager field explicitly.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: docs-site/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Promote the built+tested dist to the deploy job — deploy never rebuilds,
      # so the deployed artifact is byte-identical to the one verified here.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-site-dist
          path: docs-site/dist
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: docs-site
    steps:
      # Checkout supplies wrangler.jsonc; dist comes from the build job's
      # artifact (not a rebuild), so tested == deployed.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: docs-site-dist
          path: docs-site/dist
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs-site
          command: deploy
          # The deploy job has no pnpm/node setup (it only downloads the prebuilt
          # dist artifact). wrangler-action otherwise auto-detects pnpm from the
          # packageManager field and fails with "Unable to locate executable
          # file: pnpm" — force npm so it runs wrangler via npx (always present).
          packageManager: npm
          # No local wrangler is installed (deploy only pulls the dist artifact),
          # so wrangler-action falls back to its bundled default (3.90.0), which
          # is too old for assets-only deploys and errors "Missing entry-point".
          # Pin the same major as the devDependency so assets-only deploy works.
          wranglerVersion: "4.99.0"
