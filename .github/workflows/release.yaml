name: release

on:
  push:
    branches: [main]
  # Recovery path: re-ship artifacts for a tag that already exists. Needed
  # because every ship step below is gated on a release having just been
  # created, so re-running a failed run skips them all and reports success
  # while publishing nothing (see the `ship` resolver step).
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)ship artifacts for, e.g. v0.11.0"
        required: true
        type: string

# The release-please GitHub App token (minted below) performs every release-PR /
# tag / GitHub Release write and is the named bypass actor on the protect-main
# ruleset. The default GITHUB_TOKEN only needs packages:write to push the image +
# OCI chart to GHCR.
permissions:
  contents: read

jobs:
  release:
    name: release-please + image + OCI chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push image + chart to GHCR via GITHUB_TOKEN
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Deliberately UNSET, which means "this repository only". This App
          # exists to do exactly one job — cut releases in THIS repo — and it
          # must never be widened to a second repository. The Homebrew tap is
          # written by a DIFFERENT App (see the tap-token step below); one App,
          # one purpose. Adding `repositories:` here to reach another repo is
          # the change this comment exists to prevent.
      # The cask push targets seanb4t/homebrew-tap, a different repository, so
      # it needs its own credential rather than a widened release-App token:
      # an App installed to release engram must not also hold write access to
      # the tap. One App, one purpose.
      #
      # That purpose is TAP PUBLISHING, not "engram's tap push" — this is the
      # same App codegraph uses to publish its own cask. Sharing it across the
      # repos that publish to the tap is the same rule, not an exception to it:
      # one identity doing one job for one target repository. What is forbidden
      # is one App doing two DIFFERENT jobs (cutting releases AND writing the
      # tap), which is what this step replaced.
      #
      # GoReleaser reads this via homebrew_casks[].repository.token in
      # .goreleaser.yaml, which overrides GITHUB_TOKEN for that publisher only.
      #
      # client-id, not app-id: the action deprecated app-id in favour of
      # client-id. The release-App mint above still uses app-id and still warns,
      # because no RELEASE_APP_CLIENT_ID secret exists yet.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: tap-token
        with:
          client-id: ${{ secrets.TAP_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.TAP_PUBLISHER_APP_PRIVATE_KEY }}
          owner: seanb4t
          repositories: homebrew-tap
          # Scope the token DOWN to the one permission the cask push needs, so
          # it cannot do anything else even if the App is later granted more.
          # It also fails the release loudly — rather than pushing a cask that
          # silently never lands — if the App ever loses contents:write, since
          # GitHub refuses to mint a token scoped above what the App holds.
          permission-contents: write
      - if: ${{ github.event_name == 'push' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Single source of truth for "are we shipping, and at which tag" — the two
      # entry points (a merged release PR, or a manual re-ship) collapse here so
      # the steps below carry one condition instead of an `||` on each.
      - id: target
        name: Resolve tag to ship
        env:
          RP_CREATED: ${{ steps.release.outputs.release_created }}
          RP_TAG: ${{ steps.release.outputs.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            # The dispatch input reaches actions/checkout's `ref:` and the chart
            # version (VERSION="${TAG_NAME#v}"), so constrain its shape. Dispatch
            # already requires write access, but this rejects typos that would
            # otherwise publish a chart under a garbage version.
            if ! printf '%s' "$INPUT_TAG" |
                 grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::tag must look like vX.Y.Z (got: ${INPUT_TAG})"
              exit 1
            fi
            echo "Manual re-ship requested for $INPUT_TAG"
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "ship=true" >> "$GITHUB_OUTPUT"
          elif [ "$RP_CREATED" = "true" ] && [ -n "$RP_TAG" ]; then
            echo "release-please cut $RP_TAG"
            echo "tag=$RP_TAG" >> "$GITHUB_OUTPUT"
            echo "ship=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release created and no tag supplied — nothing to ship."
            echo "ship=false" >> "$GITHUB_OUTPUT"
          fi
      # Check out AT THE TAG (not the triggering main HEAD) so the build and the
      # published artifacts match the released commit exactly.
      - if: ${{ steps.target.outputs.ship == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.target.outputs.tag }}
          fetch-depth: 0
      - if: ${{ steps.target.outputs.ship == 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - if: ${{ steps.target.outputs.ship == 'true' }}
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - if: ${{ steps.target.outputs.ship == 'true' }}
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - if: ${{ steps.target.outputs.ship == 'true' }}
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - if: ${{ steps.target.outputs.ship == 'true' }}
        name: Log in to GHCR (image)
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      # `gomod.proxy: true` in .goreleaser.yaml means GoReleaser fetches this
      # module from proxy.golang.org at the tag and validates it against
      # sum.golang.org (verifiable builds). Both need to have INDEXED a tag that
      # is seconds old — v0.11.0 failed here with a sumdb 500 and shipped zero
      # artifacts. Requesting a not-yet-indexed version is also what triggers
      # ingestion, so polling actively warms both services rather than waiting.
      - if: ${{ steps.target.outputs.ship == 'true' }}
        name: Wait for module on Go proxy + checksum DB
        env:
          TAG_NAME: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          mod=github.com/seanb4t/engram
          for i in $(seq 1 40); do
            info=$(curl -sS -o /dev/null -w '%{http_code}' \
              "https://proxy.golang.org/${mod}/@v/${TAG_NAME}.info" || true)
            sum=$(curl -sS -o /dev/null -w '%{http_code}' \
              "https://sum.golang.org/lookup/${mod}@${TAG_NAME}" || true)
            echo "attempt ${i}: proxy=${info} sumdb=${sum}"
            if [ "$info" = "200" ] && [ "$sum" = "200" ]; then
              echo "${mod}@${TAG_NAME} is served by both — proceeding."
              exit 0
            fi
            sleep 15
          done
          echo "::error::${mod}@${TAG_NAME} not served by proxy+sumdb after 10 minutes"
          exit 1
      # Computes whether GoReleaser's Homebrew cask upload should run for this
      # tag. The cask is version-pinned (unlike the floating :latest image
      # tag below), so a workflow_dispatch backfill of an older tag must not
      # be allowed to overwrite the tap with a stale version.
      - if: ${{ steps.target.outputs.ship == 'true' }}
        name: Resolve Homebrew upload guard
        env:
          SHIPPED_TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          newest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          echo "shipped=${SHIPPED_TAG} newest=${newest}"
          if [ -z "$newest" ]; then
            echo "::error::no v* tags found — cannot compute Homebrew upload guard"
            exit 1
          fi
          # Boundary: equal to the newest tag means upload, anything older
          # means skip. The push path always ships the newest tag and so
          # always evaluates to false on its own; only a workflow_dispatch
          # backfill of an older tag lands on the skip branch. This step
          # runs unconditionally on both entry paths (not gated to
          # workflow_dispatch, unlike the :latest reconciliation below) —
          # the env var must always be defined by the time GoReleaser runs.
          # Reuses the same newest-tag computation as the reconciliation
          # step below; do not add a second, parallel implementation
          # elsewhere.
          if [ "$newest" = "$SHIPPED_TAG" ]; then
            echo "SKIP_HOMEBREW_UPLOAD=false" >> "$GITHUB_ENV"
          else
            echo "SKIP_HOMEBREW_UPLOAD=true" >> "$GITHUB_ENV"
          fi
      # release-please already created the tag-keyed GitHub Release (changelog
      # body); GoReleaser uploads the binary + image to it. The app token (not
      # GITHUB_TOKEN) writes the release, matching the release-PR actor.
      - if: ${{ steps.target.outputs.ship == 'true' }}
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # Consumed only by homebrew_casks[].repository.token — scoped to the
          # tap and nothing else. Keep it out of GITHUB_TOKEN so the tap
          # credential can never write a release, and vice versa.
          HOMEBREW_TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
      # `.goreleaser.yaml`'s docker_manifests tags `ghcr.io/seanb4t/engram:latest`
      # unconditionally, so a dispatch re-ship of an OLDER tag drags the floating
      # `latest` backwards — backfilling v0.11.0 after v0.11.1 had shipped left
      # `docker pull …:latest` serving the older build. The push path is always
      # the newest release and must keep moving `latest`, so reconcile only on
      # the dispatch path.
      - if: ${{ steps.target.outputs.ship == 'true' && github.event_name == 'workflow_dispatch' }}
        name: Reconcile :latest after a re-ship
        env:
          SHIPPED_TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          newest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          echo "shipped=${SHIPPED_TAG} newest=${newest}"
          if [ -z "$newest" ]; then
            echo "::error::no v* tags found — cannot verify :latest"
            exit 1
          fi
          if [ "$newest" = "$SHIPPED_TAG" ]; then
            echo ":latest correctly points at the newest tag — nothing to do."
            exit 0
          fi
          echo "Re-pointing :latest at ${newest} (a backfill must not regress it)"
          docker buildx imagetools create \
            -t "ghcr.io/seanb4t/engram:latest" \
            "ghcr.io/seanb4t/engram:${newest#v}"
      - if: ${{ steps.target.outputs.ship == 'true' }}
        name: Push OCI Helm chart
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.target.outputs.tag }}
        run: |-
          echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GHCR_USER" --password-stdin
          task chart:push VERSION="${TAG_NAME#v}"
