name: verify tap credential

# Read-only, dispatchable at any time, no side effects: it never writes to
# the tap, so it needs no cleanup path that could itself fail. This is
# deliberately its own workflow file rather than a job in release.yaml,
# because release.yaml's workflow_dispatch trigger requires a tag input and
# treats any supplied tag as a re-ship instruction — dispatching that
# workflow to run a probe would also re-ship release artifacts.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  verify-tap-credential:
    name: verify-tap-credential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Identical to the release job's mint: this probe verifies the
          # exact scope the release job will hold, not an approximation of
          # it.
          repositories: engram,homebrew-tap
      - name: Assert push access to seanb4t/homebrew-tap
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |-
          set -euo pipefail
          push=$(gh api repos/seanb4t/homebrew-tap --jq '.permissions.push')
          if [ "$push" != "true" ]; then
            echo "::error::seanb4t/homebrew-tap permissions.push=${push} (expected true)"
            exit 1
          fi
          echo "Token can push to seanb4t/homebrew-tap"
