name: verify tap credential

# Read-only, dispatchable at any time, no side effects: it never writes to
# the tap, so it needs no cleanup path that could itself fail. This is
# deliberately its own workflow file rather than a job in release.yaml,
# because release.yaml's workflow_dispatch trigger requires a tag input and
# treats any supplied tag as a re-ship instruction — dispatching that
# workflow to run a probe would also re-ship release artifacts.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  verify-tap-credential:
    name: verify-tap-credential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ secrets.TAP_PUBLISHER_CLIENT_ID }}
          private-key: ${{ secrets.TAP_PUBLISHER_APP_PRIVATE_KEY }}
          owner: seanb4t
          # THIS LINE IS THE ASSERTION. GitHub refuses to mint a token that
          # scopes UP beyond what the App actually holds, so if the App lacks
          # contents:write on this installation, this step fails and the run
          # goes red. No write is performed to prove write access.
          permission-contents: write
          # Identical to release.yaml's tap-token mint: this probe verifies the
          # exact scope the cask push will hold, not an approximation of it.
          # It deliberately mints the TAP-PUBLISHER App, not the release App —
          # the release App has no access to the tap and must never be given
          # any, so probing it here would assert the wrong thing.
          repositories: homebrew-tap
      # NOT an assertion — a report. `.permissions` on the repo response is
      # the AUTHENTICATED USER's role, and an App installation has no user
      # role, so every field comes back false even for a token that plainly
      # works. Measured on run 32795996823: pull was false while that very
      # call succeeded and returned the repository. Never gate on it.
      # The real gate is permission-contents: write on the mint above.
      - name: Report the tap token's scope
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |-
          set -euo pipefail
          echo "Repositories reachable by this token:"
          gh api /installation/repositories --jq '{count: .total_count, repos: [.repositories[].full_name]}'
      - name: Confirm the token reads the tap
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |-
          set -euo pipefail
          head=$(gh api repos/seanb4t/homebrew-tap/commits/main --jq '.sha')
          echo "seanb4t/homebrew-tap main is at ${head}"
          echo "contents:write was granted at mint time — the credential is proven."
