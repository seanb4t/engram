name: ci

on:
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # ci.yaml and release.yaml pin the same Renovate-tracked value.
  # renovate: datasource=github-releases depName=goreleaser/goreleaser
  GORELEASER_VERSION: v2.19.0

# CI installs each gate via its official action (the runner is bare; the local
# `task lint`/`fmt` suite assumes the tools are already on PATH). `task` remains
# the local-dev entrypoint; these jobs mirror its gates with reliable installs.
#
# Release-please PRs (head branch `release-please--*`) only touch CHANGELOG /
# manifest / Chart.yaml / plugin.json, so the Go/python/license/actionlint jobs
# skip themselves via a job-level `if` — skipped jobs still satisfy required
# status checks (unlike workflow-level path filters, which leave them stuck in
# "Expected"). `chart` and `commit-lint` still run: helm lint validates the
# Chart.yaml bump and commit-lint validates the release PR title.
jobs:
  test:
    name: test
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    # One shared Qdrant serves the whole job (#497). Four Qdrant-backed test
    # packages (internal/store, internal/server, internal/e2e,
    # internal/retrievaleval) each used to boot their own testcontainer, and
    # `go test ./...` runs packages concurrently — a 2-vCPU runner hosting
    # four Qdrant instances at once is what killed internal/store mid-run.
    # The explicit health check below is required, not decoration: GitHub
    # Actions only gates job steps on an image's own HEALTHCHECK or an
    # explicit --health-cmd, and this image ships neither (confirmed via
    # `docker inspect qdrant/qdrant:v1.20.0 --format '{{.Config.Healthcheck}}'`
    # -> <nil>) — without it `go test` could start dialing before the
    # listeners are up, reintroducing the same cascade from a different cause.
    #
    # The probe must use only what the image actually ships. Verified by
    # `docker run --rm --entrypoint sh qdrant/qdrant:v1.20.0 -c 'command -v X'`:
    # curl, wget, nc and python3 are all ABSENT; bash IS present. A
    # `curl`-based health-cmd therefore never succeeds, and the job dies at
    # "Initialize containers" with the container itself perfectly healthy
    # (status=running, exitCode=0, oomKilled=false) — a failure mode that
    # looks nothing like the #497 resource-pressure cascade it sits next to.
    # bash's /dev/tcp probe needs no external binary and targets 6334, the
    # port the Go client actually dials. Proven both directions against real
    # containers: exit 0 against a serving qdrant, exit 1 against a dead port
    # AND against this same image run with `--entrypoint sleep`, so it detects
    # "qdrant is not serving" rather than merely "a container exists".
    services:
      qdrant:
        # Keep byte-identical to internal/store/storetest.QdrantImage —
        # enforced by TestQdrantImageMatchesCIService, not by this comment.
        # Every testcontainer fallback and this shared service must stay
        # version-locked, since qdrantTOCTOUVerifiedVersion's guard exists to
        # force a conscious re-verification on a bump.
        image: qdrant/qdrant:v1.20.0
        ports:
          - 6334:6334 # gRPC — what the Go client dials, and what health-cmd probes
          - 6333:6333 # REST — dashboard/readyz, not used by the tests
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6334'" --health-interval 5s --health-timeout 3s --health-retries
          10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # Asserts the FIX'S OWN MECHANISM, not the absence of the flake it
      # replaced (CONTEXT.md D-20 — a green streak is never sufficient
      # evidence, per durable-memory finding cmjxxswmm2). The count is
      # compared against the literal 1 with no `|| echo`/`2>/dev/null ||`
      # fallback: a docker failure here yields an empty/non-"1" count and
      # correctly trips the assertion rather than silently passing.
      - name: assert exactly one Qdrant container
        env:
          ENGRAM_QDRANT_TEST_ADDR: localhost:6334
        run: |
          echo "ENGRAM_QDRANT_TEST_ADDR resolved to: ${ENGRAM_QDRANT_TEST_ADDR}"
          count=$(docker ps --filter "ancestor=qdrant/qdrant:v1.20.0" --format '{{.ID}}' | wc -l | tr -d '[:space:]')
          echo "running Qdrant containers (ancestor qdrant/qdrant:v1.20.0): ${count}"
          if [ "${count}" != "1" ]; then
            echo "::error::expected exactly one Qdrant container, found ${count}"
            docker ps --filter "ancestor=qdrant/qdrant:v1.20.0"
            exit 1
          fi
      # D-20 claim 3: prove each package actually took the SHARED-Qdrant path.
      # The `Test` step below runs `go test ./...` WITHOUT -v, so it emits only
      # package-level `ok` lines — and a package whose every test SKIPs still
      # prints `ok`. That makes `ok` unable to distinguish a running suite from
      # a silently-skipped one, which is precisely threat T-01-23. This step
      # re-runs just the shared-address assertions with -v and asserts the
      # COUNTS, so it fails rather than merely reporting.
      #
      # Expected 3 PASS + 1 SKIP, not 4 PASS. internal/retrievaleval's TestMain
      # returns before calling storetest.Run unless ENGRAM_RETRIEVAL_EVAL=1,
      # so in CI that package never dials Qdrant and does not participate in
      # the shared instance at all. Both counts are pinned: a package that
      # stops honoring the shared address (3 -> 2) and retrievaleval quietly
      # starting to participate (1 -> 0) each trip this gate.
      - name: assert shared-Qdrant participation per package
        env:
          ENGRAM_QDRANT_TEST_ADDR: localhost:6334
          ENGRAM_REQUIRE_QDRANT: "1"
        run: |
          out=$(go test -run '^TestSharedQdrantAddressHonored$' -v -count=1 \
            ./internal/store/... ./internal/server/... ./internal/e2e/... ./internal/retrievaleval/...)
          printf '%s\n' "$out"
          pass=$(printf '%s\n' "$out" | grep -o '^--- PASS: TestSharedQdrantAddressHonored' | wc -l | tr -d '[:space:]')
          skip=$(printf '%s\n' "$out" | grep -o '^--- SKIP: TestSharedQdrantAddressHonored' | wc -l | tr -d '[:space:]')
          echo "shared-address PASS=${pass} SKIP=${skip} (expected PASS=3 SKIP=1)"
          if [ "${pass}" != "3" ] || [ "${skip}" != "1" ]; then
            echo "::error::expected 3 PASS + 1 SKIP for TestSharedQdrantAddressHonored, got ${pass} PASS + ${skip} SKIP"
            exit 1
          fi
      - name: Test
        env:
          # Fail-closed real-Qdrant authz/parity gate (round-6 MED, Codex):
          # ubuntu-latest ships Docker, so the existing testcontainers boot
          # path provisions Qdrant; with this flag a boot/pull failure FAILS
          # the job instead of letting TestMain silently skip the integration
          # suite (see internal/store/storetest's RequireQdrant/Run).
          ENGRAM_REQUIRE_QDRANT: "1"
          # Points every Qdrant-backed package's TestMain fast path at the
          # shared services: container above instead of each booting its own
          # (D-15). Every Qdrant-backed package's TestMain delegates to
          # storetest.Run, which honors this var.
          ENGRAM_QDRANT_TEST_ADDR: localhost:6334
          # G-05-9 fail-closed browser gate, mirroring ENGRAM_REQUIRE_QDRANT
          # above: makes a browser-less runner FAIL TestConsoleBundleRendersRecordInBrowser
          # instead of silently skipping this tier. No install step is added —
          # ubuntu-latest already ships Chrome 151 and Chromium 151 preinstalled
          # (verified against the runner-images manifest at plan time).
          ENGRAM_REQUIRE_BROWSER: "1"
        run: go test ./...
      # D-19: capture WHY the Qdrant container died as a CI post-step rather
      # than in-Go — when the container dies mid-run the Go process often
      # cannot reach it either, so in-process capture yields nothing in
      # exactly the case that matters most. Scoped to the pinned Qdrant
      # image's own container only: no printenv, no unscoped `docker ps -a`
      # of every container on the runner. Every command tolerates its own
      # absence so this step itself never fails and masks the real failure.
      - name: qdrant container diagnostics on failure
        if: failure()
        env:
          QDRANT_IMAGE: qdrant/qdrant:v1.20.0
        run: |
          echo "--- qdrant container state ---"
          cid=$(docker ps -aq --filter "ancestor=${QDRANT_IMAGE}" | head -n1)
          if [ -n "${cid}" ]; then
            docker inspect "${cid}" --format 'id={{.Id}} status={{.State.Status}} exitCode={{.State.ExitCode}} oomKilled={{.State.OOMKilled}} error={{.State.Error}}' || echo "docker inspect failed"
            echo "--- qdrant container logs (last 200 lines) ---"
            docker logs "${cid}" 2>&1 | tail -n 200 || echo "docker logs failed"
          else
            echo "no qdrant container found (ancestor ${QDRANT_IMAGE})"
          fi
          echo "--- kernel OOM evidence ---"
          dmesg 2>/dev/null | grep -i -E 'oom|killed process' || echo "no OOM evidence in dmesg (or dmesg unavailable)"
      # Enforce go.mod/go.sum tidiness here, not via a GoReleaser hook: release
      # builds use the exact tagged module files (tag = source of truth).
      - name: go.mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: ${{ env.GORELEASER_VERSION }}
          args: check

  golangci:
    name: golangci-lint
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9

  license:
    name: license headers
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: apache/skywalking-eyes/header@a196742f472feaffafea537ce5a2a4c3c53a8de4 # v0.9.0

  chart:
    name: helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: helm lint
        run: helm lint charts/engram
      # Run the D-07/D-08 CronJob invariants + the D-09 engram.containerEnv
      # drift-pin on every PR. Task is installed via `go install` (mirroring the
      # actionlint job) since the runner is bare; without this step the
      # chart:validate guardrail never executes and containerEnv drift stays
      # green.
      - name: chart validate
        run: |
          go install github.com/go-task/task/v3/cmd/task@latest
          "$(go env GOPATH)/bin/task" chart:validate

  workflows:
    name: actionlint
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: actionlint
        run: |-
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          "$(go env GOPATH)/bin/actionlint"

  python:
    name: python
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: ruff
        run: |
          uv run --with ruff==0.16.0 ruff check skill/engram/hooks
          uv run --with ruff==0.16.0 ruff format --check skill/engram/hooks
      - name: pytest
        run: uv run --with pytest pytest skill/engram/hooks/tests -q

  buf:
    name: buf
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: buf lint
        run: go tool buf lint
      - name: buf breaking (vs main)
        run: go tool buf breaking --against 'https://github.com/seanb4t/engram.git#branch=main'
      - name: generated-code drift
        run: |
          go tool buf generate
          git diff --exit-code -- gen/ || (echo "gen/ is stale; run 'task proto:gen'"; exit 1)
      - name: vendored console gen client drift
        run: |
          rm -rf ui/src/lib/gen/engram ui/src/lib/gen/buf
          cp -R gen/ts/. ui/src/lib/gen/
          git diff --exit-code -- ui/src/lib/gen/ || (echo "ui/src/lib/gen/ is stale; run 'task proto:gen'"; exit 1)
      - name: idempotency ban (no side-effect-free RPC)
        run: |
          if grep -rEn 'idempotency_level[[:space:]]*=[[:space:]]*NO_SIDE_EFFECTS' proto/; then
            echo "::error::NO_SIDE_EFFECTS idempotency_level found in proto/ — see PITFALLS.md Pitfall 2"
            exit 1
          fi

  surfaces:
    name: surfaces
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # Mirrors the `buf` job's "generated-code drift" step exactly:
      # regenerate in place, then git diff --exit-code. No write-back — no
      # git push, no commit, no GITHUB_TOKEN use. gen/ and ui/src/lib/gen/
      # are included because a proto comment-only edit was confirmed (this
      # phase's own SUMMARY, Wave 0 resolution) to dirty protoc-gen-go's and
      # the TS plugin's generated Go-doc-comment / TSDoc output, not just
      # the anchored proto/docs-site/skill prose itself. cmd/engram/testdata/
      # is included per D-12/D-13: the pinned --help and catalog-JSON
      # goldens, regenerated via the SAME -update invocation `task
      # surfaces:gen` runs — never a second, divergent regeneration path.
      - name: interface-surface drift
        run: |
          go run ./internal/surfacesgen
          go tool buf generate
          rm -rf ui/src/lib/gen/engram ui/src/lib/gen/buf
          cp -R gen/ts/. ui/src/lib/gen/
          go test ./cmd/engram -run 'TestHelpGolden|TestCatalogGolden' -update -count=1
          git diff --exit-code -- proto/ docs-site/ skill/ gen/ ui/src/lib/gen/ cmd/engram/testdata/ || (echo "interface surfaces are stale; run 'task surfaces:gen'"; exit 1)

  ui-drift:
    name: ui vendored-asset drift
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # `uses:` steps ignore working-directory, so point action-setup at the
      # ui packageManager field (pnpm@11) explicitly — the repo root has no
      # package.json for it to read.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: |
          cd ui && pnpm install --frozen-lockfile && pnpm build
          rm -rf ../internal/webauth/static && mkdir -p ../internal/webauth/static
          cp -R build/. ../internal/webauth/static/
      - id: drift
        run: |
          if git diff --exit-code internal/webauth/static/; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          fi
      # This job runs branch code, so it holds no secret (#812). On a
      # same-repo Renovate branch it hands the rebuilt tree to
      # ui-drift-heal.yaml as an artifact; that workflow runs from main on
      # `workflow_run`, re-checks the branch, and pushes the rebuild. This
      # `if` only avoids storing artifacts nothing reads; the heal's own gate
      # decides. The drifted commit stays red either way, so a stale tree
      # never carries a passing check.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        id: heal-artifact
        if: >-
          steps.drift.outputs.drifted == 'true' && startsWith(github.head_ref, 'renovate/') && !github.event.pull_request.head.repo.fork
        with:
          name: ui-drift-static
          path: internal/webauth/static/
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error
      - name: fail with guidance
        if: steps.drift.outputs.drifted == 'true'
        env:
          HEAL_EXPECTED: ${{ steps.heal-artifact.outcome == 'success' }}
        run: |
          if [[ "$HEAL_EXPECTED" == true ]]; then
            echo "::notice::ui-drift-heal will push a rebuild onto this Renovate branch"
          fi
          echo "::error::vendored SPA is stale — run 'task ui:build' and commit"
          exit 1

  ui-test:
    name: ui tests
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: cd ui && pnpm install --frozen-lockfile
      # Type-check before the browser suite: svelte-check is the only checker
      # that reads .svelte files, and nothing else fails when it cannot run.
      - run: cd ui && pnpm check
      # Cache the Playwright browser binaries keyed on the resolved version so
      # warm runs skip the ~190MB Chromium download.
      - name: playwright version
        id: pw
        run: cd ui && echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: cd ui && pnpm exec playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: cd ui && pnpm exec playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
      - run: cd ui && pnpm test

  commit-lint:
    name: commit-lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # action-semantic-pull-request reads PR metadata via GITHUB_TOKEN
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
