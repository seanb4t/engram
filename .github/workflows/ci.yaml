name: ci

on:
  pull_request: {}
  push:
    branches:
      - main

permissions:
  contents: read

# CI installs each gate via its official action (the runner is bare; the local
# `task lint`/`fmt` suite assumes the tools are already on PATH). `task` remains
# the local-dev entrypoint; these jobs mirror its gates with reliable installs.
#
# Release-please PRs (head branch `release-please--*`) only touch CHANGELOG /
# manifest / Chart.yaml / plugin.json, so the Go/python/license/actionlint jobs
# skip themselves via a job-level `if` — skipped jobs still satisfy required
# status checks (unlike workflow-level path filters, which leave them stuck in
# "Expected"). `chart` and `commit-lint` still run: helm lint validates the
# Chart.yaml bump and commit-lint validates the release PR title.
jobs:
  test:
    name: test
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      # Enforce go.mod/go.sum tidiness here, not via a GoReleaser hook: release
      # builds use the exact tagged module files (tag = source of truth).
      - name: go.mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7
        with:
          version: "~> v2"
          args: check

  golangci:
    name: golangci-lint
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9

  license:
    name: license headers
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: apache/skywalking-eyes/header@61275cc80d0798a405cb070f7d3a8aaf7cf2c2c1 # v0.8.0

  chart:
    name: helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5
      - name: helm lint
        run: helm lint charts/engram

  workflows:
    name: actionlint
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - name: actionlint
        run: |-
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          "$(go env GOPATH)/bin/actionlint"

  python:
    name: python
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: ruff
        run: |
          uv run --with ruff ruff check skill/engram/hooks
          uv run --with ruff ruff format --check skill/engram/hooks
      - name: pytest
        run: uv run --with pytest pytest skill/engram/hooks/tests -q

  commit-lint:
    name: commit-lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # action-semantic-pull-request reads PR metadata via GITHUB_TOKEN
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
