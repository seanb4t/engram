name: deep-test

# The deep test stages: every fuzz target for a fixed time, and the property
# and model tests at high counts. They run weekly and on demand, never on a
# pull request, so they add nothing to the per-PR cost.
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=go-task/task extractVersion=^v(?<version>.*)$
  TASK_VERSION: 3.54.0

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fuzz every target
        run: task test:deep:fuzz
      # A failing fuzz run writes its input under the package's
      # testdata/fuzz/. Only the new files are uploaded, with their paths, so
      # a contributor can commit them beside the fix.
      - name: Collect new fuzz inputs
        if: failure()
        run: |
          git ls-files --others --exclude-standard -- '*/testdata/fuzz/*' > new-fuzz-inputs.txt
          mkdir -p fuzz-failures
          while read -r f; do
            mkdir -p "fuzz-failures/$(dirname "$f")"
            cp "$f" "fuzz-failures/$f"
          done < new-fuzz-inputs.txt
          cat new-fuzz-inputs.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: fuzz-failures
          path: fuzz-failures/
          if-no-files-found: warn

  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      qdrant:
        # The same image ci.yaml pins for its test job.
        image: qdrant/qdrant:v1.20.0
        ports:
          - 6334:6334
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6334'" --health-interval 5s --health-timeout 3s --health-retries
          10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # A failing property or model test prints its rapid seed in this log;
      # `go test -run <name> -rapid.seed=<seed>` replays it.
      - name: Property and model tests at deep-run counts
        env:
          ENGRAM_QDRANT_TEST_ADDR: localhost:6334
        run: task test:deep:invariants
