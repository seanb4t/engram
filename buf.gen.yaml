version: v2
managed:
  enabled: true
  disable:
    # Without this, managed mode rewrites go_package for buf/validate/validate.proto
    # (from the buf.build/bufbuild/protovalidate BSR dep) to a nonexistent local
    # gen/go/buf/validate package instead of leaving it at its published
    # buf.build/gen/go/bufbuild/protovalidate/protocolbuffers/go go_package.
    - file_option: go_package_prefix
      module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: github.com/seanb4t/engram/gen/go
# Remote plugins are PINNED. Unpinned (`remote: buf.build/bufbuild/es`), buf
# resolves the newest published plugin at generate time, so an upstream plugin
# release rewrites the `@generated by ...` header and the CI `generated-code
# drift` job fails on an unrelated PR that never touched proto/. Keep these in
# sync with the matching module versions in go.mod (protocolbuffers/go ↔
# google.golang.org/protobuf, connectrpc/go ↔ connectrpc.com/connect); bump them
# deliberately and re-run `task proto:gen` in the same commit.
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.20.0
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es:v2.12.1
    out: gen/ts
    opt: target=ts
    # Scoped to this plugin only (not a global --include-imports flag): the ES
    # plugin's engram_pb.ts imports buf/validate/validate_pb, which is not
    # otherwise emitted. The two Go plugins above carry no include_imports, so
    # gen/go/ stays unaffected.
    include_imports: true
