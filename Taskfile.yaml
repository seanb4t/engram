# Task (https://taskfile.dev) — engram dev/CI entrypoints.
# Conventions adapted from github.com/holomush/holomush (cobra+Task+goreleaser,
# no viper). CI invokes these targets; commit-lint runs in CI on PR titles.
version: "3"

vars:
  IMAGE: ghcr.io/seanb4t/engram
  CHART_REPO: oci://ghcr.io/seanb4t/charts
  # Keep in sync with the `ruff==` pin in .github/workflows/ci.yaml (python job).
  # Unpinned, `uv run --with ruff` floats to the newest release, so a new ruff
  # rule breaks CI on an unrelated PR with no code change.
  RUFF_VERSION: 0.16.0

tasks:
  default:
    cmds:
      - task: lint
      - task: test

  build:
    desc: Build the engram binary
    cmds:
      - go build -trimpath -o bin/engram ./cmd/engram

  ui:build:
    desc: Build the SvelteKit SPA and vendor it into internal/webauth/static
    dir: ui
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm build
      - rm -rf ../internal/webauth/static
      - mkdir -p ../internal/webauth/static
      - cp -R build/. ../internal/webauth/static/

  test:
    desc: Run unit tests (go + python)
    deps: ['test:go', 'test:python']
  test:go:
    cmds:
      - go test ./...
  test:python:
    desc: Run the engram skill-plugin hook tests
    cmds:
      - uv run --with pytest pytest skill/engram/hooks/tests -q
  test:e2e:
    desc: Run only the binary-level tier (builds engram, runs it, drives the MCP transport)
    cmds:
      - go test ./internal/e2e/ -count=1 -v
  test:strict:
    desc: Run the Go suite fail-closed — a missing Qdrant fails instead of silently skipping
    env:
      ENGRAM_REQUIRE_QDRANT: '1'
    cmds:
      - go test ./... -count=1
  test:coverage:
    desc: Run tests with coverage
    cmds:
      - go test -coverprofile=cover.out ./...
  test:short:
    cmds:
      - go test -short ./...
  bench:
    desc: Run Go microbenchmarks for hot paths (no live Qdrant required)
    cmds:
      - go test -run '^$' -bench=. -benchmem ./...
  eval:summary:
    desc: Score whether the configured summary model preserves caveats (needs a live gateway+model)
    cmds:
      - ENGRAM_SUMMARY_EVAL=1 go test ./internal/summarize/ -run TestSummaryFidelity -v
  eval:retrieval:
    desc: Measure recall@k/MRR incl. the #261 regression fixture (needs a live Qdrant + gateway)
    cmds:
      - ENGRAM_RETRIEVAL_EVAL=1 go test ./internal/retrievaleval/ -run TestRetrievalEval -v

  lint:
    desc: Run all linters
    deps: ['lint:go', 'lint:yaml', 'lint:actions', 'lint:markdown', 'lint:python']
  lint:go:
    cmds:
      - golangci-lint run ./...
  lint:yaml:
    cmds:
      - yamlfmt -lint .
  lint:actions:
    cmds:
      # bare actionlint auto-discovers .github/workflows/*.{yml,yaml}
      - actionlint
  lint:markdown:
    cmds:
      - rumdl check .
  lint:python:
    desc: Lint the engram skill-plugin hooks (ruff)
    cmds:
      - uv run --with ruff=={{.RUFF_VERSION}} ruff check skill/engram/hooks
      - uv run --with ruff=={{.RUFF_VERSION}} ruff format --check skill/engram/hooks

  fmt:
    desc: Format all sources
    deps: ['fmt:go', 'fmt:dprint', 'fmt:yaml', 'fmt:python']
  fmt:go:
    cmds:
      - gofmt -w .
  fmt:dprint:
    cmds:
      - dprint fmt
  fmt:yaml:
    cmds:
      - yamlfmt .
  fmt:python:
    desc: Format the engram skill-plugin hooks (ruff)
    cmds:
      - uv run --with ruff ruff format skill/engram/hooks
  fmt:check:
    cmds:
      - gofmt -l .
      - dprint check

  license:check:
    desc: Verify Apache-2.0 SPDX headers
    cmds:
      - license-eye header check
  license:add:
    cmds:
      - license-eye header fix

  chart:lint:
    desc: Lint + render the Helm chart
    # chart:validate runs the D-07/D-08 CronJob invariants + the D-09
    # engram.containerEnv drift-pin, so a direct `task chart:lint` also
    # exercises the guardrail locally (CI runs chart:validate on every PR too).
    deps: ['chart:validate']
    cmds:
      - helm lint charts/engram
      - helm template charts/engram
  chart:validate:
    desc: "Proportional CronJob + engram.containerEnv drift guardrails (bash grep/diff, no helm-unittest)"
    cmds:
      - |
        set -e
        if helm template charts/engram | grep -q 'kind: CronJob'; then
          echo "chart:validate: default render must NOT emit a CronJob (cronjob.enabled defaults false, D-07)"
          exit 1
        fi
        ENABLED_RENDER=$(helm template charts/engram --set memory.summarize.cronjob.enabled=true)
        if ! echo "$ENABLED_RENDER" | grep -q 'kind: CronJob'; then
          echo "chart:validate: --set memory.summarize.cronjob.enabled=true must emit a CronJob"
          exit 1
        fi
        if ! echo "$ENABLED_RENDER" | grep -q 'concurrencyPolicy: Forbid'; then
          echo "chart:validate: enabled CronJob render must default to concurrencyPolicy: Forbid (D-08)"
          exit 1
        fi
        if ! echo "$ENABLED_RENDER" | grep -q 'schedule: "0 3 \* \* \*"'; then
          echo "chart:validate: enabled CronJob render must default to the daily schedule '0 3 * * *' (D-08)"
          exit 1
        fi
        helm lint charts/engram
        # Drift pin: engram.containerEnv is the single source of the
        # Deployment+CronJob container env (D-09). Any edit to this block
        # must be a deliberate, verified change (re-run the byte-identical
        # Deployment render diff manually) — this checksum guards against
        # silent drift. Recorded 2026-07-16 at plan 20-04.
        EXPECTED_CHECKSUM="0a35aae002adcb17f647e23d274602e677ee6ecadfc2b5090b346be6bc7366f9"
        ACTUAL_CHECKSUM=$(awk '/define "engram.containerEnv"/{f=1} f{print} f && /^\{\{- end -\}\}$/{exit}' charts/engram/templates/_helpers.tpl | shasum -a 256 | awk '{print $1}')
        if [ "$ACTUAL_CHECKSUM" != "$EXPECTED_CHECKSUM" ]; then
          echo "chart:validate: engram.containerEnv block in _helpers.tpl has drifted (checksum $ACTUAL_CHECKSUM != expected $EXPECTED_CHECKSUM)."
          echo "  If this is a deliberate change, re-verify the Deployment env render stays correct, then update EXPECTED_CHECKSUM in this target."
          exit 1
        fi
        echo "chart:validate: OK"
  chart:push:
    desc: Package + push the OCI Helm chart (VERSION required)
    cmds:
      - helm package charts/engram --version {{.VERSION}} --app-version {{.VERSION}} -d dist/
      - helm push dist/engram-{{.VERSION}}.tgz {{.CHART_REPO}}
    requires:
      vars: [VERSION]

  # Releasing is driven by release-please (see RELEASING.md): merging the
  # release PR cuts the tag + GitHub Release, and the release workflow ships the
  # image + OCI chart. These targets are local validation only.
  release:check:
    cmds:
      - goreleaser check
  release:snapshot:
    desc: Local goreleaser dry build (no publish)
    cmds:
      - goreleaser release --snapshot --clean

  proto:lint:
    desc: Lint protobuf schema
    cmds:
      - go tool buf lint
      - |
        if grep -rEn 'idempotency_level[[:space:]]*=[[:space:]]*NO_SIDE_EFFECTS' proto/; then
          echo "engram.proto: NO_SIDE_EFFECTS idempotency_level is banned (GET-reachable + CSRF risk — PITFALLS.md Pitfall 2)"
          exit 1
        fi
  proto:gen:
    desc: Regenerate connect stubs (Go + TS) and re-vendor the console gen client tree
    cmds:
      - go tool buf generate
      - rm -rf ui/src/lib/gen/engram ui/src/lib/gen/buf
      - cp -R gen/ts/. ui/src/lib/gen/

  deps:
    cmds:
      - go mod tidy
  tools:
    desc: Install tools declared via go.mod `tool` directives (Go 1.24+)
    cmds:
      - go install tool
  clean:
    cmds:
      - rm -rf bin dist cover.out
