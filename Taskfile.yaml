# Task (https://taskfile.dev) — engram dev/CI entrypoints.
# Conventions adapted from github.com/holomush/holomush (cobra+Task+goreleaser,
# no viper). CI invokes these targets; commit-lint runs in CI on PR titles.
version: "3"

vars:
  IMAGE: ghcr.io/seanb4t/engram
  CHART_REPO: oci://ghcr.io/seanb4t/charts

tasks:
  default:
    cmds:
      - task: lint
      - task: test

  build:
    desc: Build the engram binary
    cmds:
      - go build -trimpath -o bin/engram ./cmd/engram

  test:
    desc: Run unit tests (go + python)
    deps: ['test:go', 'test:python']
  test:go:
    cmds:
      - go test ./...
  test:python:
    desc: Run the engram skill-plugin hook tests
    cmds:
      - uv run --with pytest pytest skill/engram/hooks/tests -q
  test:coverage:
    desc: Run tests with coverage
    cmds:
      - go test -coverprofile=cover.out ./...
  test:short:
    cmds:
      - go test -short ./...

  lint:
    desc: Run all linters
    deps: ['lint:go', 'lint:yaml', 'lint:actions', 'lint:markdown', 'lint:python']
  lint:go:
    cmds:
      - golangci-lint run ./...
  lint:yaml:
    cmds:
      - yamlfmt -lint .
  lint:actions:
    cmds:
      - actionlint
  lint:markdown:
    cmds:
      - rumdl check .
  lint:python:
    desc: Lint the engram skill-plugin hooks (ruff)
    cmds:
      - uv run --with ruff ruff check skill/engram/hooks
      - uv run --with ruff ruff format --check skill/engram/hooks

  fmt:
    desc: Format all sources
    deps: ['fmt:go', 'fmt:dprint', 'fmt:yaml', 'fmt:python']
  fmt:go:
    cmds:
      - gofmt -w .
  fmt:dprint:
    cmds:
      - dprint fmt
  fmt:yaml:
    cmds:
      - yamlfmt .
  fmt:python:
    desc: Format the engram skill-plugin hooks (ruff)
    cmds:
      - uv run --with ruff ruff format skill/engram/hooks
  fmt:check:
    cmds:
      - gofmt -l .
      - dprint check

  license:check:
    desc: Verify Apache-2.0 SPDX headers
    cmds:
      - license-eye header check
  license:add:
    cmds:
      - license-eye header fix

  chart:lint:
    desc: Lint + render the Helm chart
    cmds:
      - helm lint charts/engram
      - helm template charts/engram
  chart:push:
    desc: Package + push the OCI Helm chart (VERSION required)
    cmds:
      - helm package charts/engram --version {{.VERSION}} --app-version {{.VERSION}} -d dist/
      - helm push dist/engram-{{.VERSION}}.tgz {{.CHART_REPO}}
    requires:
      vars: [VERSION]

  release:check:
    cmds:
      - goreleaser check
  release:snapshot:
    cmds:
      - goreleaser release --snapshot --clean
  release:dry-run:
    desc: Preview the next semver cog would derive (no tag, no push)
    cmds:
      - task: _cog
        vars: {COG_ARGS: bump --auto --dry-run}
  release:
    desc: >-
      Cut a release from main: derive the next semver from Conventional Commits, tag the current commit (no bump commit),
      and push the tag to fire the release workflow (image + OCI chart). Preview first with release:dry-run.
    cmds:
      # --disable-bump-commit tags the real commit instead of an empty
      # chore(version) commit, matching every prior tag.
      - task: _cog
        vars: {COG_ARGS: bump --auto --disable-bump-commit}
      - git push origin "$(git describe --tags --abbrev=0)"
    preconditions:
      - sh: '[ -z "$(git status --porcelain)" ]'
        msg: "Working tree is dirty — commit or discard changes before releasing."
  _cog:
    internal: true
    # cog's branch_whitelist=[main] reads git HEAD's branch. In a colocated jj
    # checkout HEAD is detached, so attach it to main for the cog run and
    # restore the prior state on exit (a no-op in a plain-git checkout).
    cmds:
      - |
        set -e
        if ! git symbolic-ref -q HEAD >/dev/null; then
          main_sha=$(git rev-parse refs/heads/main)
          git symbolic-ref HEAD refs/heads/main
          trap 'git symbolic-ref --delete HEAD 2>/dev/null || true; git update-ref --no-deref HEAD "$main_sha"' EXIT
        fi
        cog {{.COG_ARGS}}
    requires:
      vars: [COG_ARGS]

  deps:
    cmds:
      - go mod tidy
  tools:
    desc: Install tools declared via go.mod `tool` directives (Go 1.24+)
    cmds:
      - go install tool
  clean:
    cmds:
      - rm -rf bin dist cover.out
