# Cocogitto configuration — https://docs.cocogitto.io/
# Tag-only releases: cog derives the next semver from conventional commits and
# creates a v-prefixed tag (no bump commit, no in-repo CHANGELOG). GoReleaser
# generates the GitHub Release notes. Conventional-commit validation runs in CI
# on PR titles (jj does not fire local git hooks reliably; CI is authoritative).
tag_prefix = "v"
disable_changelog = true
branch_whitelist = ["main"]
ignore_merge_commits = true

[commit_types]
deps = { omit_from_changelog = true }
