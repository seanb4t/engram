#
# license-eye (Apache SkyWalking Eyes) config. Licenses Go code + functional
# markdown; generated/vendored/user-facing content is excluded.
header:
  license:
    content: |
      SPDX-License-Identifier: Apache-2.0
      Copyright 2026 Sean Brandt
    pattern: |
      SPDX-License-Identifier: Apache-2\.0
  paths:
    - "cmd/**"
    - "internal/**"
    - "docs/**"
    - "*.md"
    - "skill/**"
  paths-ignore:
    - "vendor/**"
    - "dist/**"
    - "bin/**"
    - "AGENTS.md"
    - "**/*.golden"
    - "**/.gitkeep"
    - "skill/**/*.json"
    - "skill/**/.gitignore"
    # SKILL.md must open with YAML frontmatter on line 1 for Claude Code's
    # skill loader, so it cannot carry a leading SPDX comment (matches the
    # upstream skills ecosystem convention); repo LICENSE + plugin.json cover it.
    - "skill/**/SKILL.md"
  language:
    Markdown:
      extensions: [".md"]
      comment_style_id: AngleBracket
    Python:
      extensions: [".py"]
      comment_style_id: Hashtag
    UvScript:
      filenames:
        - "session-start-memory-recall"
        - "posttooluse-memory-capture-nudge"
      comment_style_id: Hashtag
  comment: on-failure
