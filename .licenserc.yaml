#
# license-eye (Apache SkyWalking Eyes) config. Licenses Go code + functional
# markdown; generated/vendored/user-facing content is excluded.
header:
  license:
    content: |
      SPDX-License-Identifier: Apache-2.0
      Copyright 2026 Sean Brandt
    pattern: |
      SPDX-License-Identifier: Apache-2\.0
  paths:
    - "cmd/**"
    - "internal/**"
    - "proto/**"
    - "docs/**"
    - "*.md"
    - "skill/**"
  paths-ignore:
    - "vendor/**"
    - "dist/**"
    - "bin/**"
    - "AGENTS.md"
    - "**/*.golden"
    - "**/.gitkeep"
    - "skill/**/*.json"
    - "skill/**/.gitignore"
    # SKILL.md and slash-command markdown must open with YAML frontmatter on
    # line 1 for Claude Code's skill/command loader, so they cannot carry a
    # leading SPDX comment (matches the upstream skills ecosystem convention);
    # repo LICENSE + plugin.json cover provenance.
    # Astro .md/.mdx content opens with YAML frontmatter on line 1 (same
    # conflict as skill/**/SKILL.md), and node_modules/dist are generated.
    # repo LICENSE covers provenance.
    - "docs-site/**"
    - "skill/**/SKILL.md"
    - "skill/**/commands/*.md"
    # ADR markdown is render-generated from its bd decision record (source of
    # truth = bd; "do not edit manually"), so an SPDX comment would be clobbered
    # on every re-render. repo LICENSE + the bd record cover provenance.
    - "docs/adr/*.md"
    # CHANGELOG.md is generated and owned by release-please (rewritten on every
    # release), so it cannot carry a leading SPDX comment. repo LICENSE covers it.
    - "CHANGELOG.md"
    # Vendored built SPA (generated by 'task ui:build'); repo LICENSE covers provenance.
    - "internal/webauth/static/**"
  language:
    Markdown:
      extensions: [".md"]
      comment_style_id: AngleBracket
    Python:
      extensions: [".py"]
      comment_style_id: Hashtag
    UvScript:
      filenames:
        - "session-start-memory-recall"
        - "posttooluse-memory-capture-nudge"
      comment_style_id: Hashtag
  comment: on-failure
