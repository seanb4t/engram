#
# license-eye (Apache SkyWalking Eyes) config. Licenses Go code + functional
# markdown; generated/vendored/user-facing content is excluded.
header:
  license:
    content: |
      SPDX-License-Identifier: Apache-2.0
      Copyright 2026 Sean Brandt
    pattern: |
      SPDX-License-Identifier: Apache-2\.0
  paths:
    - "cmd/**"
    - "internal/**"
    - "proto/**"
    - "docs/**"
    - "*.md"
    - "skill/**"
  paths-ignore:
    - "vendor/**"
    - "dist/**"
    - "bin/**"
    - "AGENTS.md"
    - "**/*.golden"
    - "**/.gitkeep"
    # Python test/lint caches (created by `task test:python` under skill/**);
    # the root .pytest_cache/.ruff_cache are already git-ignored, but the tools
    # also drop nested caches (e.g. skill/engram/hooks/.pytest_cache) that a
    # local `task license:check` would otherwise flag. CI is unaffected (clean
    # checkouts), so these are ignored to match the root-cache posture.
    - "**/.pytest_cache/**"
    - "**/.ruff_cache/**"
    - "**/__pycache__/**"
    - "skill/**/*.json"
    - "skill/**/.gitignore"
    # SKILL.md and slash-command markdown must open with YAML frontmatter on
    # line 1 for Claude Code's skill/command loader, so they cannot carry a
    # leading SPDX comment (matches the upstream skills ecosystem convention);
    # repo LICENSE + plugin.json cover provenance.
    # Astro .md/.mdx content opens with YAML frontmatter on line 1 (same
    # conflict as skill/**/SKILL.md), and node_modules/dist are generated.
    # repo LICENSE covers provenance.
    - "docs-site/**"
    - "skill/**/SKILL.md"
    - "skill/**/commands/*.md"
    # GSD planning artifacts. Already out of scope by omission from `paths`
    # above, but listed explicitly because the consequence of a leading SPDX
    # comment here is silent and destructive rather than cosmetic: gsd-tools
    # parses YAML frontmatter and requires `---` on LINE 1. A header above it
    # makes the frontmatter unreadable, so `verification.status` reports
    # "missing" on a VERIFICATION.md that actually PASSED — and execute-phase
    # routes on that, re-dispatching a completed phase. It also silently
    # degrades uat.classify-coverage to mode=legacy, dropping every
    # auto-covered deliverable and manufacturing bogus UAT checkpoints.
    # Both were observed live on 2026-08-02 (fixes ad8650cb, 797ea24f).
    # Same class as the skill/**/SKILL.md carve-out below: frontmatter owns
    # line 1. repo LICENSE covers provenance for everything under .planning/.
    - ".planning/**"
    # ADR markdown is render-generated from its bd decision record (source of
    # truth = bd; "do not edit manually"), so an SPDX comment would be clobbered
    # on every re-render. repo LICENSE + the bd record cover provenance.
    - "docs/adr/*.md"
    # CHANGELOG.md is generated and owned by release-please (rewritten on every
    # release), so it cannot carry a leading SPDX comment. repo LICENSE covers it.
    - "CHANGELOG.md"
    # Vendored built SPA (generated by 'task ui:build'); repo LICENSE covers provenance.
    - "internal/webauth/static/**"
    # Cedar policy corpus (.cedar) and the reference-only Cedar JSON schema
    # (D-06, Phase 22) — not a recognized comment-style language for
    # license-eye and not runtime-CI-gated; repo LICENSE covers provenance.
    - "internal/authz/policies/*.cedar"
    - "internal/authz/schema.json"
    # internal/keylinks's committed testdata/*.md fixtures are synthetic
    # plan-shaped documents the guard's own fixture-pair test parses as
    # frontmatter (D-06, Phase 1 gate-ci-integrity) — not real docs, and a
    # leading SPDX comment would corrupt the `---`-on-line-1 frontmatter
    # contract these fixtures deliberately mimic. repo LICENSE covers
    # provenance, same rationale as the .planning/** carve-out above.
    - "internal/keylinks/testdata/*.md"
  language:
    Markdown:
      extensions: [".md"]
      comment_style_id: AngleBracket
    Python:
      extensions: [".py"]
      comment_style_id: Hashtag
    UvScript:
      filenames:
        - "session-start-memory-recall"
        - "posttooluse-memory-capture-nudge"
      comment_style_id: Hashtag
  comment: on-failure
