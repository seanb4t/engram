<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>004 · Related &amp; Tags</title>
<link rel="stylesheet" href="../themes/default.css">
<script src="../themes/display.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding-top: 44px; background: var(--color-bg); color: var(--color-text);
    font: 13px/1.45 var(--font-sans); -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  input { font: inherit; color: inherit; }
  .mono { font-family: var(--font-mono); }
  .muted { color: var(--color-text-muted); }
  .faint { color: var(--color-text-faint); }
  .i, button, .row, .node, .bar-row, .tm-block, .chain-card, .cloud-tag { transition: all 0.15s ease; }

  /* ---------- variant nav ---------- */
  #variant-nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 9998; height: 44px;
    display: flex; align-items: center; gap: 4px; padding: 0 12px;
    background: var(--color-surface); border-bottom: 1px solid var(--color-border);
  }
  .variant-tab { padding: 5px 10px; border-radius: var(--radius-md); color: var(--color-text-muted); font-size: var(--text-sm); white-space: nowrap; }
  .variant-tab:hover { background: var(--color-hover); color: var(--color-text); }
  .variant-tab.active { background: var(--color-primary-soft); color: var(--color-primary); }
  .nav-spacer { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; }
  .seg button { white-space: nowrap; padding: 3px 8px; font-size: var(--text-xs); color: var(--color-text-muted); border-right: 1px solid var(--color-border); }
  .seg button:last-child { border-right: 0; }
  .seg button:hover { background: var(--color-hover); color: var(--color-text); }
  .seg button.on { background: var(--color-selected); color: var(--color-text); }
  .seg-label { font-size: var(--text-2xs); color: var(--color-text-faint); margin-right: 6px; text-transform: uppercase; letter-spacing: .06em; }
  @media (max-width: 760px) { .variant-tab { font-size: var(--text-2xs); padding: 4px 6px; } .seg-label { display: none; } #variant-nav { overflow-x: auto; } }

  /* ---------- console-wide text size ----------
     Everything inside .ui-scaled sizes off --ui-font (12–16, default 15; themes/display.js sets it on <html>).
     calc(N*var(--u)) is N px at 13px, so 13px reproduces the original sketch. The sketch chrome (tabs, toolbar) stays fixed. */
  .ui-scaled {
    --u: calc(var(--ui-font, 15px) / 13);
    --text-2xs: calc(11*var(--u)); --text-xs: calc(12*var(--u)); --text-sm: calc(13*var(--u)); --text-base: calc(14*var(--u));
    --text-lg: calc(16*var(--u)); --text-xl: calc(18*var(--u)); --text-2xl: calc(22*var(--u)); --row-h: calc(28*var(--u));
    font-size: var(--text-sm);
  }

  /* ---------- frame / viewport ---------- */
  #frame { container: frame / inline-size; margin: 0 auto; padding: 12px 16px 80px; max-width: 100%; transition: max-width 0.15s ease; }
  #frame.constrained { border-left: 1px dashed var(--color-border); border-right: 1px dashed var(--color-border); min-height: calc(100vh - 44px); }

  /* ---------- shared bits ---------- */
  .card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); min-width: 0; }
  .card-h { display: flex; flex-wrap: wrap; align-items: center; gap: calc(6*var(--u)); padding: calc(8*var(--u)) calc(10*var(--u)); border-bottom: 1px solid var(--color-border-subtle); }
  .card-f { display: flex; flex-wrap: wrap; align-items: center; gap: calc(10*var(--u)); padding: calc(6*var(--u)) calc(10*var(--u)); border-top: 1px solid var(--color-border-subtle); font-size: var(--text-xs); }
  .h-title { font-size: var(--text-xs); font-weight: 600; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: .06em; }
  .chip { display: inline-flex; align-items: center; gap: calc(4*var(--u)); padding: 1px calc(6*var(--u)); border-radius: var(--radius-sm); font-size: var(--text-2xs); border: 1px solid var(--color-border); color: var(--color-text-muted); white-space: nowrap; }
  .cat-chip { border-color: transparent; background: var(--color-surface-2); color: var(--color-text); }
  .cat-chip i, .dot { width: calc(7*var(--u)); height: calc(7*var(--u)); border-radius: 50%; display: inline-block; flex: none; }
  .state-word { font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--color-warning); border: 1px dashed var(--color-border); padding: 0 calc(4*var(--u)); border-radius: var(--radius-sm); white-space: nowrap; }
  /* state chips never overflow their box: wrap to their own line, clip, then collapse to "first +N" (fitStates) */
  .states { display: inline-flex; flex: 0 1 auto; gap: calc(3*var(--u)); min-width: 0; max-width: 100%; overflow: hidden; vertical-align: middle; }
  .states > .state-word { flex: none; }
  .states.collapsed > .state-word:first-child { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .state-word.more { color: var(--color-text-muted); border-style: solid; }
  /* state chips sit along the bottom edge of their card, left-aligned, never overflowing */
  .states-foot { display: flex; min-width: 0; padding-top: calc(4*var(--u)); margin-top: calc(4*var(--u)); border-top: 1px dashed var(--color-border-subtle); }
  .states-foot:empty { display: none; }
  .tagc { font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--color-text-muted); background: var(--color-surface-2); padding: 1px calc(5*var(--u)); border-radius: var(--radius-sm); white-space: nowrap; }
  .tagc.shared { color: var(--color-primary); background: var(--color-primary-soft); }
  .btn { display: inline-flex; align-items: center; gap: calc(6*var(--u)); padding: calc(4*var(--u)) calc(9*var(--u)); border-radius: var(--radius-md); border: 1px solid var(--color-border); font-size: var(--text-xs); color: var(--color-text-muted); background: var(--color-surface); }
  .btn:hover { background: var(--color-hover); color: var(--color-text); border-color: var(--color-text-faint); }
  .btn.primary { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }
  .btn.primary:hover { background: var(--color-primary-hover); }
  .btn:disabled { opacity: .4; cursor: default; }
  kbd { font-family: var(--font-mono); font-size: var(--text-2xs); border: 1px solid var(--color-border); border-bottom-width: 2px; border-radius: calc(3*var(--u)); padding: 0 calc(4*var(--u)); color: var(--color-text-muted); }

  /* edge-type glyphs: identity by border style + letter, never colour alone */
  .g { display: inline-flex; align-items: center; justify-content: center; width: calc(16*var(--u)); height: calc(16*var(--u)); font: 600 calc(9*var(--u))/1 var(--font-mono); color: var(--color-text-muted); border-radius: calc(3*var(--u)); border: 1px solid var(--color-text-faint); flex: none; }
  .g-supersession { border: 2px solid var(--color-text-muted); }

  .g-tag { border-style: dotted; border-width: 2px; }
  .g-vector { border-color: var(--color-border); }
  .g:hover { color: var(--color-primary); border-color: var(--color-primary); }

  .edge-toggle { display: inline-flex; align-items: center; gap: calc(6*var(--u)); padding: calc(3*var(--u)) calc(8*var(--u)); border: 1px solid var(--color-border); border-radius: var(--radius-full); font-size: var(--text-xs); color: var(--color-text); }
  .edge-toggle:hover { border-color: var(--color-text-faint); background: var(--color-hover); }
  .edge-toggle.off { color: var(--color-text-faint); opacity: .55; }
  .edge-toggle.off svg { opacity: .4; }
  .edge-toggle .n { color: var(--color-text-faint); font-size: var(--text-2xs); }
  .swatch { color: var(--color-text-muted); flex: none; width: calc(var(--sw, 24)*var(--u)); height: calc(10*var(--u)); }

  .filter-chip { display: inline-flex; align-items: center; gap: calc(6*var(--u)); padding: 2px calc(4*var(--u)) 2px calc(8*var(--u)); border-radius: var(--radius-full); background: var(--color-primary-soft); color: var(--color-primary); font-size: var(--text-xs); }
  .filter-chip button { width: calc(18*var(--u)); height: calc(18*var(--u)); border-radius: 50%; }
  .filter-chip button:hover { background: var(--color-primary); color: #fff; }

  /* anchor bar */
  .anchor-bar { display: flex; flex-direction: column; gap: calc(6*var(--u)); margin-bottom: calc(10*var(--u)); }
  .crumbs { display: flex; align-items: center; gap: calc(6*var(--u)); flex-wrap: wrap; font-size: var(--text-xs); color: var(--color-text-faint); }
  .crumbs .crumb { font-family: var(--font-mono); color: var(--color-text-muted); padding: 1px calc(4*var(--u)); border-radius: var(--radius-sm); }
  .crumbs .crumb:hover { background: var(--color-hover); color: var(--color-text); }
  .crumbs .crumb.cur { color: var(--color-text); background: var(--color-surface-2); }
  .anchor-card { display: grid; grid-template-columns: auto 1fr auto; gap: calc(4*var(--u)) calc(12*var(--u)); align-items: center; padding: calc(10*var(--u)) calc(12*var(--u)); background: var(--color-surface); border: 1px solid var(--color-border); border-left: calc(3*var(--u)) solid var(--color-primary); border-radius: var(--radius-lg); }
  .anchor-card > * { min-width: 0; }
  .anchor-card .meta { display: flex; flex-wrap: wrap; align-items: center; gap: calc(6*var(--u)); min-width: 0; }
  .anchor-card .sum { font-size: var(--text-base); font-weight: 500; min-width: 0; }
  .anchor-card .tags { display: flex; gap: calc(4*var(--u)); flex-wrap: wrap; justify-content: flex-end; }
  .anchor-card .call { grid-column: 1 / -1; font-size: var(--text-2xs); }
  .anchor-card .states-foot { grid-column: 1 / -1; margin-top: 0; }
  .call b { color: var(--color-text-muted); font-weight: 500; }
  .call .trunc { color: var(--color-warning); }
  @container frame (max-width: 700px) { .anchor-card { grid-template-columns: 1fr; } .anchor-card .tags { justify-content: flex-start; } }

  .banner { display: flex; align-items: center; gap: calc(8*var(--u)); padding: calc(6*var(--u)) calc(10*var(--u)); margin-bottom: calc(8*var(--u)); border: 1px dashed var(--color-warning); border-radius: var(--radius-md); color: var(--color-warning); font-size: var(--text-xs); }
  .banner .mono { color: var(--color-text); }

  /* skeleton */
  @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: .8 } }
  .sk { background: var(--color-surface-2); border-radius: var(--radius-sm); animation: pulse 1.2s ease infinite; }
  .sk-line { height: calc(10*var(--u)); margin: calc(8*var(--u)) 0; }
  .pulse { animation: pulse 1.2s ease infinite; }
  .loading-line { font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--color-text-faint); }
  .loading-line::after { content: '▍'; animation: pulse .8s steps(2) infinite; }

  .empty-state { padding: calc(16*var(--u)); font-size: var(--text-xs); color: var(--color-text-muted); }
  .empty-state h4 { margin: 0 0 calc(6*var(--u)); font-size: var(--text-sm); color: var(--color-text); }
  .empty-state table { border-collapse: collapse; margin-top: calc(6*var(--u)); }
  .empty-state td { padding: 2px calc(10*var(--u)) 2px 0; vertical-align: top; }

  /* tooltip */
  #tip { position: fixed; z-index: 10000; pointer-events: none; max-width: calc(360*var(--u)); padding: calc(8*var(--u)) calc(10*var(--u)); border-radius: var(--radius-md); background: var(--color-surface-2); border: 1px solid var(--color-border); box-shadow: var(--shadow-md); font-size: var(--text-xs); opacity: 0; transform: translateY(2px); transition: opacity 0.15s ease, transform 0.15s ease; }
  #tip.show { opacity: 1; transform: none; }
  #tip .t-head { display: flex; flex-wrap: wrap; align-items: center; gap: calc(6*var(--u)); margin-bottom: calc(4*var(--u)); }
  #tip .t-sum { color: var(--color-text); margin-bottom: calc(6*var(--u)); }
  #tip .t-edge { display: grid; grid-template-columns: auto 1fr; gap: calc(6*var(--u)); align-items: start; padding: calc(3*var(--u)) 0; border-top: 1px solid var(--color-border-subtle); }
  #tip .t-edge .ev { color: var(--color-text-muted); display: flex; flex-wrap: wrap; gap: calc(3*var(--u)); }
  .cite { font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--color-text-muted); background: var(--color-surface-2); border: 1px dashed var(--color-border); padding: 0 calc(4*var(--u)); border-radius: var(--radius-sm); white-space: nowrap; }
  .cite b { color: var(--color-text-faint); font-weight: 500; }
  .tagw { font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--color-text-muted); background: var(--color-surface-2); border: 1px dotted var(--color-text-faint); padding: 0 calc(4*var(--u)); border-radius: var(--radius-sm); white-space: nowrap; }
  .tagw b { color: var(--color-text); font-weight: 500; }

  /* ---------- SVG graph (A + C) ---------- */
  svg.graph { width: 100%; height: auto; display: block; }
  .ring { fill: none; stroke: var(--color-border-subtle); stroke-width: 1; }
  .ring-label { fill: var(--color-text-faint); font: calc(10px*var(--gs, 1)) var(--font-mono); }
  .edge { fill: none; stroke: var(--color-text-muted); transition: opacity 0.15s ease, stroke 0.15s ease; }
  .edge.t-vector { stroke: var(--color-text-faint); }
  .edge.t-supersession { stroke: var(--color-text-muted); }
  .edge-hit { fill: none; stroke: transparent; stroke-width: 10; cursor: help; }
  .node { cursor: pointer; }
  .node circle.dotc { stroke: var(--color-bg); stroke-width: 2; }
  .node:hover circle.dotc { stroke: var(--color-primary); stroke-width: 2.5; }
  .node .halo { fill: none; stroke: transparent; stroke-width: 2; }
  .node.sel .halo { stroke: var(--color-primary); }
  .node.hidden-state circle.dotc { opacity: .45; stroke: var(--color-text-faint); stroke-dasharray: 2 2; stroke-width: 1.5; }
  .node-label { fill: var(--color-text-faint); font: calc(9.5px*var(--gs, 1)) var(--font-mono); pointer-events: none; }
  /* node state strip: small chips directly beneath the node (label), collapsed to "first +N" by width */
  .node-states { pointer-events: none; }
  .node-states rect { fill: var(--color-bg); stroke: var(--color-border); stroke-width: 1; stroke-dasharray: 2 1.5; }
  .node-states rect.more { stroke-dasharray: none; }
  .node-states text { fill: var(--color-warning); font: calc(8.5px*var(--gs, 1)) var(--font-mono); }
  .node-states text.more { fill: var(--color-text-muted); }
  .node.anchor { cursor: default; }
  .node.anchor .ring-a { fill: none; stroke: var(--color-primary); stroke-width: 2; }
  .node.anchor .ring-b { fill: none; stroke: var(--color-primary-soft); stroke-width: 6; }
  .fdim { opacity: .14; }
  svg.focus .edge:not(.on) { opacity: .12; }
  svg.focus .node:not(.on):not(.anchor) { opacity: .35; }
  svg.focus .edge.on { stroke: var(--color-primary); opacity: 1; }
  .arrow-muted { fill: var(--color-text-muted); }
  .arrow-hi { fill: var(--color-primary); }

  /* ---------- Variant A ---------- */
  .a-grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(calc(240*var(--u)), 1fr); gap: calc(10*var(--u)); align-items: start; }
  @container frame (max-width: 900px) { .a-grid { grid-template-columns: 1fr; } }
  .graph-wrap { padding: calc(6*var(--u)); position: relative; }
  .cat-key { display: flex; gap: calc(10*var(--u)); flex-wrap: wrap; }
  .cat-key span { display: inline-flex; align-items: center; gap: calc(4*var(--u)); color: var(--color-text-muted); }
  .cloud { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px calc(8*var(--u)); padding: calc(12*var(--u)); line-height: 1.15; }
  .cloud-tag { color: var(--color-text-muted); padding: 1px calc(3*var(--u)); border-radius: var(--radius-sm); }
  .cloud-tag:hover { color: var(--color-text); background: var(--color-hover); }
  .cloud-tag.anchor-tag { color: var(--color-text); text-decoration: underline; text-decoration-color: var(--color-primary); text-decoration-thickness: 2px; text-underline-offset: calc(3*var(--u)); }
  .cloud-tag.sel { background: var(--color-primary-soft); color: var(--color-primary); }
  .more-row { display: flex; align-items: center; justify-content: space-between; gap: calc(8*var(--u)); padding: calc(6*var(--u)) calc(10*var(--u)); border-top: 1px solid var(--color-border-subtle); font-size: var(--text-xs); color: var(--color-text-faint); }
  .linkbtn { color: var(--color-primary); font-size: var(--text-xs); }
  .linkbtn:hover { text-decoration: underline; }

  /* ---------- Variant B ---------- */
  .b-grid { display: grid; grid-template-columns: minmax(0, 1fr) calc(300*var(--u)); gap: calc(10*var(--u)); align-items: start; }
  @container frame (max-width: 900px) { .b-grid { grid-template-columns: 1fr; } }
  .lanes { display: flex; flex-direction: column; gap: calc(8*var(--u)); min-width: 0; }
  .lane-h { display: flex; align-items: center; gap: calc(8*var(--u)); padding: calc(6*var(--u)) calc(10*var(--u)); border-bottom: 1px solid var(--color-border-subtle); flex-wrap: wrap; }
  .lane-h .name { font-weight: 600; font-size: var(--text-sm); }
  .lane-h .cnt { font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--color-text-faint); }
  .lane-h .cap { font-size: var(--text-2xs); color: var(--color-text-faint); flex: 1; min-width: calc(160*var(--u)); }
  .lane-h .eye { font-size: var(--text-2xs); color: var(--color-text-faint); padding: 2px calc(6*var(--u)); border-radius: var(--radius-sm); border: 1px solid transparent; }
  .lane-h .eye:hover { border-color: var(--color-border); color: var(--color-text); }
  .lane.off .lane-body { display: none; }
  .lane.off .lane-h { border-bottom: 0; opacity: .6; }
  .row { display: grid; grid-template-columns: calc(96*var(--u)) minmax(0, 1fr) auto auto auto; gap: calc(10*var(--u)); align-items: center; min-height: var(--row-h); padding: calc(3*var(--u)) calc(10*var(--u)); border-bottom: 1px solid var(--color-border-subtle); cursor: pointer; }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: var(--color-hover); }
  .row.linked { background: var(--color-selected); box-shadow: inset 2px 0 0 var(--color-primary); }
  .row.flash { animation: flash .9s ease; }
  @keyframes flash { 0%, 40% { background: var(--color-primary-soft); } 100% { background: transparent; } }
  .row .id { display: flex; flex-wrap: wrap; align-items: center; gap: 2px calc(6*var(--u)); min-width: 0; overflow: hidden; font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-text-muted); }
  .row .sum { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .ev { display: flex; gap: calc(4*var(--u)); align-items: center; justify-content: flex-end; flex-wrap: wrap; max-width: calc(380*var(--u)); }
  .row .multi { display: flex; gap: calc(3*var(--u)); align-items: center; min-width: calc(40*var(--u)); justify-content: flex-end; }
  .row .st { display: flex; justify-content: flex-end; min-width: 0; max-width: calc(120*var(--u)); }
  .row .st:empty { display: none; }
  .row .multi .x { font: calc(10*var(--u)) var(--font-mono); color: var(--color-text-faint); margin-right: 2px; }
  .row.fdim { opacity: .3; }
  @container frame (max-width: 700px) { .row { grid-template-columns: minmax(0, 1fr) auto; } .row .sum { grid-column: 1 / -1; grid-row: 2; white-space: normal; } .row .ev { grid-column: 1; grid-row: 3; justify-content: flex-start; } .row .ev { min-width: 0; overflow: hidden; } .row .ev > * { max-width: 100%; overflow: hidden; text-overflow: ellipsis; } .row .st { grid-column: 2; grid-row: 3; align-self: end; } .row .multi { grid-column: 2; grid-row: 1; } }
  .cos { display: inline-flex; align-items: center; gap: calc(6*var(--u)); font-family: var(--font-mono); font-size: var(--text-xs); }
  .cos .track { width: calc(48*var(--u)); height: calc(4*var(--u)); background: var(--color-surface-2); border-radius: 2px; overflow: hidden; }
  .cos .fill { height: 100%; background: var(--color-text-muted); border-radius: 0 2px 2px 0; }
  .lane-empty { padding: calc(8*var(--u)) calc(10*var(--u)); font-size: var(--text-xs); color: var(--color-text-faint); }
  .chain { display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding: calc(10*var(--u)); }
  .chain-col { display: flex; flex-direction: column; gap: calc(6*var(--u)); justify-content: center; }
  .chain-card { width: calc(190*var(--u)); min-width: 0; overflow: hidden; display: flex; flex-direction: column; padding: calc(6*var(--u)) calc(8*var(--u)); border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-bg); cursor: pointer; }
  .chain-card:hover { border-color: var(--color-text-faint); background: var(--color-hover); }
  .chain-card.is-anchor { border: 1px solid var(--color-primary); background: var(--color-primary-soft); cursor: default; }
  .chain-card.hidden-state { opacity: .55; border-style: dashed; }
  .chain-card.linked { box-shadow: 0 0 0 2px var(--color-primary); }
  .chain-card .top { display: flex; align-items: center; gap: calc(6*var(--u)); min-width: 0; font-size: var(--text-2xs); color: var(--color-text-faint); }
  .chain-card .sid { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-text-muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chain-card .states-foot { margin-top: auto; }

const forceCache = {};

      if (d2 > 14400) continue;

function squarify(items, W, H) {
  const total = items.reduce((s, i) => s + i.count, 0), scale = W * H / total, out = [];
  let rect = { x: 0, y: 0, w: W, h: H }, row = [];
  const arr = items.map(i => ({ ...i, a: i.count * scale }));
  const worst = (r, side) => { const s = r.reduce((a, b) => a + b.a, 0); let mx = 0, mn = Infinity; r.forEach(x => { mx = Math.max(mx, x.a); mn = Math.min(mn, x.a); }); return Math.max(side * side * mx / (s * s), (s * s) / (side * side * mn)); };
  const lay = r => {
    const s = r.reduce((a, b) => a + b.a, 0);
    if (rect.w >= rect.h) { const cw = s / rect.h; let cy = rect.y; r.forEach(x => { const ch = x.a / cw; out.push({ ...x, x: rect.x, y: cy, w: cw, h: ch }); cy += ch; }); rect = { x: rect.x + cw, y: rect.y, w: rect.w - cw, h: rect.h }; }
    else { const ch = s / rect.w; let cx = rect.x; r.forEach(x => { const cw = x.a / ch; out.push({ ...x, x: cx, y: rect.y, w: cw, h: ch }); cx += cw; }); rect = { x: rect.x, y: rect.y + ch, w: rect.w, h: rect.h - ch }; }
  };
  arr.forEach(it => { const side = Math.min(rect.w, rect.h); if (!row.length || worst([...row, it], side) <= worst(row, side)) row.push(it); else { lay(row); row = [it]; } });
  if (row.length) lay(row);
  return out;
}

/* =====================================================================

   ===================================================================== */
function render() {
  if (!isLoading()) compute();
  document.querySelectorAll('#state-seg button').forEach(b => b.classList.toggle('on', b.dataset.v === S.view));
  ({ a: renderA, b: renderB, c: renderC, s: renderS })[S.variant]();

function showVariant(id, btn) {

  document.querySelectorAll('.variant').forEach(v => { v.style.display = 'none'; v.innerHTML = ''; });
  document.querySelectorAll('.variant-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('variant-' + id).style.display = 'block';
  (btn || document.querySelector(`.variant-tab[data-variant="${id}"]`)).classList.add('active');

function recenter(id) {
  const m = BY_ID[id] || BY_KEY[id]; if (!m) return;
  if (m.key.startsWith('f')) { flashToast(`${m.short_id} is a sketch filler — re-centre works on the named records`); return; }
  if (S.view === 'empty' || S.view === 'loading') S.view = 'populated';
  S.pending = m.key; S.busy = true; hideTip(); render();
  setTimeout(() => {
    S.anchor = m.key; S.trail.push(m.key); S.busy = false; S.pending = null; S.sel = null; S.selLane = null; S.drawer = false; S.vecAll = false;
    render();
  }, 480);
}

  const idx = toIndex ?? S.trail.length - 2;
  const key = S.trail[idx];
  S.pending = key; S.busy = true; render();
  setTimeout(() => { S.trail = S.trail.slice(0, idx + 1); S.anchor = key; S.busy = false; S.pending = null; S.sel = null; S.selLane = null; S.drawer = false; render(); }, 300);
}
function flashToast(msg) {
  const t = $('#tip'); t.innerHTML = msg; t.style.left = '50%'; t.style.top = '60px'; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v;
  if (a === 'view') { S.view = v; S.busy = false; S.sel = null; S.drawer = false; S.vecAll = false; render(); }
  else if (a === 'edge') { S.on[v] = !S.on[v]; render(); }
  else if (a === 'tag') { S.tagFilter = S.tagFilter === v ? null : v; render(); }
  else if (a === 'tags-all') { S.tagsAll = !S.tagsAll; render(); }
  else if (a === 'vec-more') { S.vecAll = true; render(); }
  else if (a === 'recenter') recenter(v);
  else if (a === 'back') goBack();
  else if (a === 'crumb') goBack(+v);
  else if (a === 'select') { S.sel = v; render(); }
  else if (a === 's-select') selectS(v, el.dataset.lane, true);
  else if (a === 'drawer-close') { S.drawer = false; applySelS(); }
  else if (a === 'rail') setRail(v);
  else if (a === 'display') dpop.hidden ? openDisplay(el) : closeDisplay(true);
  else if (a === 'jump') {
    e.stopPropagation();
    const row = document.querySelector(`#variant-b [data-lane="${el.dataset.t}"][data-rid="${v}"]`) || document.querySelector(`#variant-b .chain-card[data-rid="${v}"]`);
    if (row) { row.scrollIntoView({ behavior: 'smooth', block: 'center' }); row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash'); }
  }
}, true);
document.addEventListener('dblclick', e => { const n = e.target.closest('#c-svg .node[data-v], #s-svg .node[data-v], #variant-s [data-act="s-select"][data-lane]'); if (n) recenter(n.dataset.v); });
document.addEventListener('focusin', e => {
  const r = e.target.closest && e.target.closest('#variant-s [data-act="s-select"][data-lane]');
  if (r && !S.kbdMove) selectS(r.dataset.v, r.dataset.lane, true);
});

document.addEventListener('input', e => {
  if (e.target.id === 'tag-search') { S.tagQuery = e.target.value; $('#bars').innerHTML = tagBars(isLoading() ? null : RES); }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !dpop.hidden) { e.preventDefault(); closeDisplay(true); return; }
  if (e.target.closest && e.target.closest('#display-pop')) return;
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === '[') { goBack(); return; }
  if (S.variant === 's') {
    if (e.key === 'Escape' && S.drawer) { S.drawer = false; applySelS(); return; }
    if (e.key === 'g') { setRail(S.rail === 'graph' ? 'tags' : 'graph'); return; }
    if (isLoading() || !RES.related.length) return;
    if (e.key === 'j' || e.key === 'k' || e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      const items = [...document.querySelectorAll('#variant-s [data-act="s-select"][data-lane]')].filter(x => x.offsetParent !== null);
      if (!items.length) return;
      let i = items.findIndex(x => x.dataset.v === S.sel && x.dataset.lane === S.selLane);
      if (i < 0) i = items.findIndex(x => x.dataset.v === S.sel);
      const fwd = e.key === 'j' || e.key === 'ArrowDown';
      const nx = items[i < 0 ? 0 : Math.max(0, Math.min(items.length - 1, i + (fwd ? 1 : -1)))];
      selectS(nx.dataset.v, nx.dataset.lane, false);
      S.kbdMove = true; nx.focus({ preventScroll: true }); S.kbdMove = false;
      nx.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      e.preventDefault(); return;
    }
    if (e.key === 'Enter' && S.sel && !e.target.closest('button, a, input, select')) { e.preventDefault(); recenter(S.sel); }
    return;
  }
  if (S.variant !== 'c' || isLoading() || !RES.related.length) return;
  const list = RES.related.filter(r => visibleEdges(r).length);
  const i = list.findIndex(r => r.memory.id === S.sel);
  if (e.key === 'j' || e.key === 'ArrowDown') { S.sel = list[Math.min(list.length - 1, i + 1)].memory.id; render(); e.preventDefault(); }
  if (e.key === 'k' || e.key === 'ArrowUp') { S.sel = list[Math.max(0, i - 1)].memory.id; render(); e.preventDefault(); }
  if (e.key === 'Enter' && S.sel) recenter(S.sel);
});

  } else showTip(tipHTML(rm, t.dataset.tipType), e);
});
document.addEventListener('mousemove', e => { if (tip.classList.contains('show')) moveTip(e); });

/* =====================================================================
   Sketch toolbar
   ===================================================================== */
$('#theme-switcher').addEventListener('change', e => { document.querySelector('link[href*=themes]').href = '../themes/' + e.target.value + '.css'; });
document.querySelectorAll('#vp-btns button').forEach(b => b.addEventListener('click', () => {
  const v = b.dataset.vp, f = $('#frame');
  f.style.maxWidth = v === 'full' ? '100%' : v + 'px';
  f.classList.toggle('constrained', v !== 'full');
  document.querySelectorAll('#vp-btns button').forEach(x => x.style.background = x === b ? '#6a5acd' : '#333');
  setTimeout(() => { renderTreemap(); fitStates($('#variant-' + S.variant)); applySelS(); relayoutSGraph(); }, 200);
}));
const annoTip = $('#anno-tip');
$('#anno-toggle').addEventListener('change', e => { document.body.classList.toggle('anno', e.target.checked); if (!e.target.checked) { annoTip.classList.remove('show'); document.querySelectorAll('.anno-outline').forEach(x => x.classList.remove('anno-outline')); } });
document.addEventListener('mousemove', e => {
  if (!document.body.classList.contains('anno')) return;
  const el = e.target;
  document.querySelectorAll('.anno-outline').forEach(x => x.classList.remove('anno-outline'));
  if (!el || el.closest('#sketch-tools') || el === document.body || el.id === 'frame') { annoTip.classList.remove('show'); return; }
  el.classList.add('anno-outline');
  const cs = getComputedStyle(el);
  const cls = (typeof el.className === 'string' ? el.className : el.className.baseVal || '').replace('anno-outline', '').trim().split(/\s+/).slice(0, 2).join('.');
  annoTip.innerHTML = `${el.tagName.toLowerCase()}${cls ? '.' + cls : ''}<br>font ${cs.fontSize} ${cs.fontWeight} · ${cs.fontFamily.split(',')[0]}<br>color ${cs.color}${el instanceof SVGElement ? `<br>fill ${cs.fill} · stroke ${cs.stroke} ${cs.strokeDasharray !== 'none' ? '· dash ' + cs.strokeDasharray : ''}` : `<br>bg ${cs.backgroundColor}<br>pad ${cs.padding} · radius ${cs.borderRadius}`}`;
  annoTip.style.left = Math.min(innerWidth - 330, e.clientX + 12) + 'px'; annoTip.style.top = (e.clientY + 16) + 'px';
  annoTip.classList.add('show');
});
addEventListener('resize', () => { if (S.variant === 'c') renderTreemap(); fitStates($('#variant-' + S.variant)); applySelS(); relayoutSGraph(); });

/* =====================================================================
   Display: console-wide text size (themes/display.js owns storage, ⌘+/⌘−/⌘0 and cross-tab sync)
   ===================================================================== */
const D = window.EngramDisplay;
const MOD = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent) ? '⌘' : 'Ctrl';
const dpop = $('#display-pop'), tsSeg = $('#ts-seg');
const aaButton = () => `<button class="aa" data-act="display" aria-haspopup="dialog" aria-expanded="${!dpop.hidden}" aria-controls="display-pop" title="Display: text size">Aa</button>`;
$('#ts-keys').innerHTML = `<span><kbd>${MOD}</kbd><kbd>+</kbd> larger</span><span><kbd>${MOD}</kbd><kbd>−</kbd> smaller</span><span><kbd>${MOD}</kbd><kbd>0</kbd> reset to ${D.DEFAULT}</span>`;
function syncDisplay() {
  const n = D.get();
  $('#ts-val').textContent = n + 'px';
  tsSeg.querySelectorAll('button').forEach(b => { const on = +b.dataset.ts === n; b.setAttribute('aria-checked', on); b.tabIndex = on ? 0 : -1; });
}
function placeDisplay() {
  const btn = $('#variant-s .aa'); if (!btn || dpop.hidden) return;
  const r = btn.getBoundingClientRect();
  dpop.style.left = Math.max(8, Math.min(r.right - dpop.offsetWidth, innerWidth - dpop.offsetWidth - 8)) + 'px';
  dpop.style.top = (r.bottom + 6) + 'px';
}
function openDisplay(btn) {
  dpop.hidden = false; syncDisplay(); placeDisplay();
  btn.setAttribute('aria-expanded', 'true'); hideTip();
  (tsSeg.querySelector('[aria-checked=true]') || tsSeg.firstElementChild).focus();
}
function closeDisplay(refocus) {
  if (dpop.hidden) return; dpop.hidden = true;
  const btn = $('#variant-s .aa'); if (btn) { btn.setAttribute('aria-expanded', 'false'); if (refocus) btn.focus(); }
}
function toast(html) { const t = $('#toast'); t.innerHTML = html; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800); }
tsSeg.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { D.set(+b.dataset.ts); b.focus(); } });
tsSeg.addEventListener('keydown', e => {
  const d = { ArrowLeft: -1, ArrowDown: -1, ArrowRight: 1, ArrowUp: 1 }[e.key]; if (!d) return;
  e.preventDefault(); e.stopPropagation(); D.step(d); tsSeg.querySelector('[aria-checked=true]').focus();
});
document.addEventListener('mousedown', e => { if (!e.target.closest('#display-pop') && !e.target.closest('[data-act=display]')) closeDisplay(false); });
let lastSize = D.get();
// every change — segment, ⌘+/⌘−/⌘0, or another tab — re-renders so SVG labels, node sizes and chip fits re-lay out
addEventListener('engram:textsize', e => {
  const n = e.detail.size, changed = n !== lastSize; lastSize = n;
  syncDisplay(); hideTip(); render(); placeDisplay();
  toast(`Text size ${n}px${changed ? '' : n === D.MAX ? ' (max)' : n === D.MIN ? ' (min)' : ''}`);
});
syncDisplay();

render();
</script>
</body>
</html>
