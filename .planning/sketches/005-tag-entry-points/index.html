<script>
/* ===================================================================
   Fake data. Shapes mirror proto ListTagsResponse { tags:[{tag,count}], more }.
   ListTags carries NO total — copy may say "more exist", never "of 1,340".
   One fetch per scope key at limit=1000 (D-18) feeds header, picker and bars.
   =================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const REAL = ['engram','decision','gotcha','convention','user-said','console','ui','milestone-2026-09-25.01','qdrant','gsd','phase-04','phase-03','phase-05','related-memories','recall-gate','list-tags','supersede-memory','archive','search','keyboard','svelte-5','bits-ui','connect','proto','wire-contract','mcp-parity','testing','reusable-technique','cedar','authz','owner','shared','scheduled','expired','jev','rerank','discovery','citations','rules','migrate','schema-version','reindex','embedder','oidc','csrf','resume-envelope','tanstack-query','virtual-list','hover-card','detail-pane','command-menu','header-search','tag-reuse','rarity-weighted-tags','cross-spine','short-id','idempotency-key','validate-only','chromedp','vitest-browser','wcag-2.2-aa','dark-mode','text-size','container-queries','css-grid','octopus-review','release-please','calver','helm','goreleaser','koanf','cobra','buf','facet','payload-index'];
function buildTags(scope) {
  const out = [];
  const scale = scope ? 0.58 : 1;

  else if (e.key === 'Home') { e.preventDefault(); S.barIdx = 0; }
  else if (e.key === 'End') { e.preventDefault(); S.barIdx = rows.length - 1; }
  else if (e.key === 'Enter' || (e.key === ' ' && e.target.tagName !== 'INPUT')) { e.preventDefault(); toggleTag(rows[S.barIdx].dataset.tag); refocus(e.target); return; }
  else if (e.key === 'Escape') { S.popOpen = null; renderFacets(); return; }
  else return;
  rows.forEach((r, i) => r.classList.toggle('active', i === S.barIdx));
  $(`#${id}`).setAttribute('aria-activedescendant', `${id}-b${S.barIdx}`);
  rows[S.barIdx].scrollIntoView({ block: 'nearest' });
}
function refocus(el) { const id = el.id; const n = id && $('#' + id); if (n) n.focus(); }
function refocusBars() { const b = $('#popbars') || $('#panelbars'); if (b && S.v !== 'b') b.focus({ preventScroll: true }); }

function act(a) {
  switch (a.dataset.act) {
    case 'rm-tag': toggleTag(a.dataset.tag); break;
    case 'rm-scope': S.scope = ''; syncSeg(); render(); break;
    case 'row-tag': toggleTag(a.dataset.tag, 'add'); break;
    case 'clear-tags': S.chips = []; render(); break;
    case 'show-all': S.showAll = true; rerenderOpen(); break;
    case 'show-top': S.showAll = false; rerenderOpen(); break;
    case 'close-panel': S.panelOpen = false; render(); break;
  }
}
function rerenderOpen() { renderFacets(); renderPanel(); if (S.popOpen === 'cb') focusCb(); }
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a && !a.closest('.pop') && !a.closest('.panel')) act(a);
  if (S.popOpen && !e.target.closest('.pop') && !e.target.closest('#plus-tag') && !e.target.closest('#tags-btn') && !e.target.closest('.chip')) { S.popOpen = null; renderFacets(); }
});

/* tooltip: popularity + rarity kept separate (D-15). n comes from ListScopes counts — flagged in README. */
const N_STORE = 1200;
function tipMove(e) {
  const r = e.target.closest('[data-count]'); const tip = $('#tip');
  if (!r) return tipHide();
  const c = +r.dataset.count;
  tip.innerHTML = `#${esc(r.dataset.tag)}<br>count ${c} · rarity ln(n/df) ${Math.log(N_STORE / c).toFixed(2)}<br><span style="opacity:.6">n = ${N_STORE} recall-visible records (ListScopes)</span>`;
  tip.classList.add('show'); tip.style.left = Math.min(innerWidth - 330, e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 16) + 'px';
}
function tipHide() { $('#tip').classList.remove('show'); }
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1600); }

/* ---------- chrome ---------- */
$$('.variant-tab').forEach(b => b.addEventListener('click', () => { S.v = b.dataset.v; S.popOpen = null; S.showAll = false; S.barFilter = ''; render(); }));
function syncSeg() { $$('#scope-seg button').forEach(b => b.classList.toggle('on', b.dataset.sc === S.scope)); $$('#state-seg button').forEach(b => b.classList.toggle('on', b.dataset.s === S.state)); }
$$('#state-seg button').forEach(b => b.addEventListener('click', () => { S.state = b.dataset.s; S.showAll = false; syncSeg(); const o = S.popOpen; render(); S.popOpen = o; renderFacets(); if (o === 'cb') focusCb(); }));
$$('#scope-seg button').forEach(b => b.addEventListener('click', () => { S.scope = b.dataset.sc; syncSeg(); render(); }));
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); $('#hs-in').focus(); }
  if (e.key === 'Escape' && S.popOpen) { S.popOpen = null; renderFacets(); }
});
$('#theme-switcher').addEventListener('change', e => { document.querySelector('link[href*=themes]').href = '../themes/' + e.target.value + '.css'; });
$$('#vp-btns button').forEach(b => b.addEventListener('click', () => {
  const f = $('#frame'); const v = b.dataset.vp;
  f.style.maxWidth = v === 'full' ? '100%' : v + 'px'; f.classList.toggle('constrained', v !== 'full');
  $$('#vp-btns button').forEach(x => x.style.background = x === b ? '#6a5acd' : '#333');
}));
const tsSync = () => { $('#ts-v').textContent = EngramDisplay.get(); };
$('#ts-up').addEventListener('click', () => { EngramDisplay.step(1); tsSync(); });
$('#ts-dn').addEventListener('click', () => { EngramDisplay.step(-1); tsSync(); });
window.addEventListener('engram:textsize', tsSync); tsSync();
let anno = false;
$('#anno-toggle').addEventListener('change', e => { anno = e.target.checked; if (!anno) $('#anno-tip').style.display = 'none'; });
document.addEventListener('mousemove', e => {
  if (!anno) return; const el = e.target; const at = $('#anno-tip');
  if (!el || el.closest('#sketch-tools')) { at.style.display = 'none'; return; }
  const cs = getComputedStyle(el);
  at.textContent = `${el.tagName.toLowerCase()}${el.className && typeof el.className === 'string' ? '.' + el.className.split(' ')[0] : ''} · ${cs.fontSize} · pad ${cs.padding} · ${cs.color}`;
  at.style.display = 'block'; at.style.left = (e.clientX + 12) + 'px'; at.style.top = (e.clientY + 12) + 'px';
});

render();
</script>
</body>
