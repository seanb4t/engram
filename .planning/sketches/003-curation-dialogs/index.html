<style>
*{box-sizing:border-box}

/* ---------- tab bar + scenario bar ---------- */

/* ---------- viewport frame ---------- */
#frame{position:relative;margin:0 auto;height:calc(100vh - 70px - 40px);max-width:100%;transform:translateZ(0);overflow:hidden;container-type:inline-size;container-name:frame;transition:max-width .15s ease}

.variant{position:absolute;inset:0;display:none}

.btn{height:calc(26*var(--u));padding:0 calc(10*var(--u));border:1px solid var(--color-border);background:var(--color-surface);border-radius:var(--radius-sm);cursor:pointer;transition:all .15s ease;display:inline-flex;align-items:center;gap:calc(6*var(--u));white-space:nowrap;font-size:var(--text-sm)}

/* ---------- list ---------- */
.list-top{display:flex;align-items:center;gap:calc(10*var(--u));height:calc(34*var(--u));padding:0 calc(10*var(--u));border:1px solid var(--color-border);border-bottom:0;border-radius:var(--radius-md) var(--radius-md) 0 0;background:var(--color-surface);font-size:var(--text-xs);color:var(--color-text-muted)}

.list{border:1px solid var(--color-border);border-radius:0 0 var(--radius-md) var(--radius-md);background:var(--color-surface)}
.row:last-child{border-radius:0 0 var(--radius-md) var(--radius-md)}
.row{position:relative;display:grid;grid-template-columns:calc(16*var(--u)) calc(92*var(--u)) calc(80*var(--u)) minmax(0,1fr) auto auto calc(38*var(--u));align-items:center;gap:calc(10*var(--u));height:var(--row-h);padding:0 calc(10*var(--u));border-bottom:1px solid var(--color-border-subtle);cursor:default;transition:background .15s ease, opacity .15s ease;font-size:var(--text-sm)}

  .row{grid-template-columns:calc(16*var(--u)) calc(10*var(--u)) calc(76*var(--u)) minmax(0,1fr) auto 0 0;gap:calc(8*var(--u))}

}

/* ---------- menu (C) ---------- */
.menu{position:absolute;right:calc(6*var(--u));top:calc(26*var(--u));z-index:20;min-width:calc(210*var(--u));background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:var(--radius-md);box-shadow:var(--shadow-md);padding:calc(4*var(--u));animation:pop .15s ease}

.lbl{font-size:var(--text-2xs);text-transform:uppercase;letter-spacing:.04em;color:var(--color-text-faint);display:flex;justify-content:space-between;gap:calc(8*var(--u));margin-bottom:calc(4*var(--u))}
.tchip{border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface);padding:calc(6*var(--u)) calc(6*var(--u)) calc(6*var(--u)) calc(8*var(--u));margin-bottom:calc(6*var(--u));transition:all .15s ease}

.status{border-radius:var(--radius-md);padding:calc(8*var(--u)) calc(10*var(--u));font-size:var(--text-xs);display:flex;flex-direction:column;gap:calc(6*var(--u));border:1px solid var(--color-border);background:var(--color-surface-2)}

.inline-ed{border-top:1px solid var(--color-primary);border-bottom:1px solid var(--color-primary);background:var(--color-bg);padding:calc(10*var(--u)) calc(12*var(--u)) calc(10*var(--u)) calc(36*var(--u));animation:grow .15s ease}

.dpop .lbl .mono{font-family:var(--font-mono);text-transform:none;letter-spacing:0;color:var(--color-text)}

/* text-size toast (same look as sketches 001/002; C's undo toasts are a separate design) */

/* ---------- sketch toolbar (hardcoded dark, not part of the design) ---------- */
#sketch-tools{position:fixed;bottom:12px;right:12px;z-index:9999;font:12px/1.2 system-ui,sans-serif;background:rgba(0,0,0,.72);color:#fff;padding:6px 8px;border-radius:8px;opacity:.45;transition:opacity .15s ease;display:flex;gap:8px;align-items:center}

<script>
/* ================= data ================= */
const ME = 'sean';

const NOW0 = Date.parse('2026-09-26T12:00:00Z');

const ICON = {
  check: '<svg class="i okicon" viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  chain: '<svg class="i" viewBox="0 0 16 16"><path d="M6.5 9.5l3-3M5.5 7L4 8.5a2.5 2.5 0 003.5 3.5L9 10.5M10.5 9L12 7.5A2.5 2.5 0 008.5 4L7 5.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
};
function genSid(){ const a = '0123456789abcdefghjkmnpqrstvwxyz'; let s = ''; for (let i = 0; i < 10; i++) s += a[Math.floor(Math.random() * 32)]; return s; }

// State words: archived › superseded › expired › scheduled (expired suppresses scheduled)
function stateWords(r){
  const w = [], now = NOW0 + CLOCK * 60000;
  if (r.archived_at) w.push('archived');
  if (r.superseded_by) w.push('superseded');
  const expired = r.not_after && now >= Date.parse(r.not_after);
  const scheduled = r.not_before && now < Date.parse(r.not_before);
  if (expired) w.push('expired'); else if (scheduled) w.push('scheduled');
  return w;
}
const wordsHTML = r => stateWords(r).map(x => `<span class="sw sw-${x}">${x}</span>`).join('');

function headOf(r){ let x = r; const seen = new Set(); while (x && x.superseded_by && !seen.has(x.id)) { seen.add(x.id); x = byId(x.superseded_by) || x; } return x; }
const predsOf = id => DB.filter(r => r.superseded_by === id);
const inChain = r => !!r.superseded_by || predsOf(r.id).length > 0;
function depthBelowHead(r){ let d = 0, x = r; while (x.superseded_by) { d++; x = byId(x.superseded_by); } return d; }

// Supersede target issues, in the server's evaluation order: access, rule, already superseded
function supIssue(r){
  if (r.owner !== ME) return { code: 'not-owned', text: `shared by ${r.owner} — readable, but only the owner can supersede` };
  if (r.category === 'rule') return { code: 'rule', text: 'rules cannot be superseded — delete it instead' };
  if (r.superseded_by) { const h = headOf(r); return { code: 'already-superseded', text: `not the live head — current head is ${h.short_id}`, head: h }; }
  return null;
}
const arcIssue = r => r.owner !== ME ? { code: 'not-owned', text: `shared by ${r.owner} — archive is owner-only` } : null;

/* chain model */
function tree(node, depth = 0, seen = new Set()){
  const preds = node.virtual ? node.preds.map(byId) : predsOf(node.id);
  seen.add(node.id);
  return { node, depth, kids: preds.filter(p => p && !seen.has(p.id)).map(p => tree(p, depth + 1, seen)) };
}
function levels(t){ const L = []; (function walk(n){ (L[n.depth] = L[n.depth] || []).push(n); n.kids.forEach(walk); })(t); return L; }
function paths(t){ const out = []; (function walk(n, acc){ const a = [n.node, ...acc]; if (!n.kids.length) out.push(a); else n.kids.forEach(k => walk(k, a)); })(t, []); return out; }
function flat(t){ const out = []; (function walk(n){ out.push(n); n.kids.forEach(walk); })(t); return out; }
function virtualHead(s){ return { virtual: true, id: '__new', short_id: '(new)', category: s.form.category, summary: s.form.summary || '(no summary)', preds: s.targets.slice() }; }

function cnode(n, o = {}){
  const r = n; const cls = ['cnode', o.hl === r.id && 'hl', r.virtual && 'new', o.bad && o.bad.has(r.id) && 'bad', o.isNew === r.id && 'hl'].filter(Boolean).join(' ');
  return `<span class="${cls}" ${r.virtual ? '' : `data-sact="peek" data-id="${r.id}"`} title="${esc(r.summary)}">${dot(r)}<span class="mono">${r.short_id}</span><span class="csum">${esc(r.summary)}</span>${r.virtual ? '' : wordsHTML(r)}</span>`;
}
function badSet(s){ const b = new Set(); s.targets.forEach(id => { if (supIssue(byId(id))) b.add(id); }); return b; }

// A: columns, oldest left → head right
function chainColumns(t, o = {}){
  const L = levels(t); let h = '<div class="chain-cols">';
  for (let d = L.length - 1; d >= 0; d--) {
    h += `<div class="ccol"><span class="ccol-h">${d === 0 ? 'head · d0' : 'd' + d}</span>${L[d].map(n => cnode(n.node, o)).join('')}</div>`;
    if (d > 0) h += '<span class="carrow">→</span>';
  }
  return h + '</div><div class="legend">← predecessors (superseded, hidden from recall) · arrows read "superseded by" · head is the live record</div>';
}
// B: vertical timeline, head on top
function chainTimeline(t, o = {}){
  return '<div class="tl">' + flat(t).map(n => `<div class="tl-item ${n.depth === 0 ? 'head' : ''}" style="--d:${n.depth};--c:var(--cat-${n.node.category})"><span class="tl-dot"></span><span class="tl-d">${n.depth === 0 ? 'head' : 'd' + n.depth}</span>${cnode(n.node, o)}</div>`).join('') + '</div><div class="legend">each level down is an older predecessor; indentation = depth below the head</div>';
}
// C: breadcrumb per lineage path
function chainCrumbs(t, o = {}){
  return '<div class="crumbs">' + paths(t).map(p => `<div class="crumb">${p.map((n, i) => (i ? '<span class="sepc">›</span>' : '') + cnode(n, o)).join('')}</div>`).join('') + '</div>';
}

/* ================= fake backend ================= */
let MODE = 'success';
function fakeCall(kind, ctx, force){
  const m = force || MODE;
  return new Promise(res => setTimeout(() => {
    if (m === 'success') return res({ ok: true });
    if (m === 'validation') return res(kind === 'supersede'
      ? { ok: false, kind: 'validation', field: 'summary', env: `field=summary hint=too_long: summary must be at most 512 bytes (got ${Math.max(601, bytes(ctx.form.summary))})` }
      : { ok: false, kind: 'validation', field: 'ids', env: `field=ids hint=format: id "${ctx.sids[0].slice(0, 9)}" is not a UUID or a 10-char short id` });
    if (m === 'rejection') {
      if (kind === 'supersede') { const t = ctx.sids[ctx.sids.length - 1]; return res({ ok: false, kind: 'rejection', env: `target is already superseded: ${t}`, targets: [t], note: 'Another session superseded this target after you opened the editor. Supersede its current head instead. Nothing was written.' }); }
      return res({ ok: false, kind: 'rejection', env: `not found: ${ctx.sids[0]}`, targets: [ctx.sids[0]], note: 'Not found, not owned and ambiguous short id are one rejection by design. Nothing was changed.' });
    }
    return res({ ok: false, kind: 'reauth', env: 'unauthenticated: bearer token expired at 11:58:02Z' });
  }, 700));
}
function envHTML(res){
  let m = res.env.match(/^field=(\S+) hint=(\S+): (.*)$/);
  if (m) return `<div class="env-k"><span class="pill k">field=${esc(m[1])}</span><span class="pill k">hint=${esc(m[2])}</span></div><div>${esc(m[3])}</div><code class="env-raw">${esc(res.env)}</code>`;
  m = res.env.match(/^([^:]+): (.*)$/);
  return `<div class="env-k"><span class="pill k">${esc(m[1])}</span>${m[2].split(', ').map(x => `<span class="pill">${esc(x)}</span>`).join('')}</div>${res.note ? `<div>${esc(res.note)}</div>` : ''}<code class="env-raw">${esc(res.env)}</code>`;
}
function statusHTML(s, kind){
  if (s.status === 'loading') return `<div class="status loading"><span class="spin"></span>${esc(s.loadingText || 'Calling…')}</div>`;
  if (s.status === 'reauthing') return `<div class="status loading"><span class="spin"></span>Re-authenticating via OIDC… your ${kind === 'sup' ? 'draft' : 'selection'} is kept</div>`;
  if (s.status === 'error') {
    if (s.res.kind === 'reauth') return `<div class="status warn"><div><b>Session expired.</b> Nothing was written; your ${kind === 'sup' ? 'draft' : 'selection'} is kept.</div><code class="env-raw">${esc(s.res.env)}</code><div class="row-b"><button class="btn sm primary" data-sact="reauth" data-kind="${kind}">Re-authenticate &amp; retry</button></div></div>`;
    return `<div class="status err"><b>${s.res.kind === 'validation' ? 'Rejected — fix the named field and resend' : 'Server rejected the call — nothing was written'}</b>${envHTML(s.res)}</div>`;
  }
  return '';
}

/* ================= mutations ================= */
function applySupersede(ids, f){
  const sid = genSid();
  const rec = { id: '0192f3a1-new0-7000-8000-' + sid, short_id: sid, category: f.category, summary: f.summary.trim(), content: f.content.trim(), scope: f.scope, tags: f.tags.split(',').map(t => t.trim()).filter(Boolean), owner: ME, visibility: 'private', superseded_by: null, archived_at: null, created_at: nowISO(), supersedes: ids.slice() };
  DB.push(rec); ids.forEach(id => byId(id).superseded_by = rec.id); return rec;
}
function applyArchive(ids, op){
  const done = [], already = [];
  ids.forEach(id => { const r = byId(id);
    if (op === 'archive') { if (r.archived_at) already.push(r); else { r.archived_at = nowISO(); done.push(r); } }
    else { if (!r.archived_at) already.push(r); else { r.archived_at = null; done.push(r); } } });
  return { done, already };
}

}

function listRows(v){ const st = VS[v]; return DB.filter(r => st.showHidden || !stateWords(r).length).sort((a, b) => b.created_at.localeCompare(a.created_at)); }
function flash(v, ids){ const st = VS[v]; ids.forEach(id => st.flash.add(id)); setTimeout(() => ids.forEach(id => st.flash.delete(id)), 1700); }

function newSession(ids){
  const recs = ids.map(byId).sort((a, b) => b.created_at.localeCompare(a.created_at));
  const src = recs[0];
  return { targets: ids.slice(), prefillSid: src.short_id, status: 'idle', res: null, errField: null, result: null, step: 1, rejected: [],
    form: { summary: src.summary, content: src.content, category: CATS.includes(src.category) ? src.category : 'decision', tags: src.tags.join(', '), scope: src.scope.startsWith('rule:') ? REPO : src.scope } };
}
function gateReason(s){
  if (!s.targets.length) return 'Add at least one target';
  const bad = s.targets.filter(id => supIssue(byId(id))).length;
  if (bad) return `Remove ${plural(bad, 'invalid target')} — an invalid set rejects the whole call`;
  if (!s.form.content.trim()) return 'content is required';
  return '';
}
function targetsGate(s){
  if (!s.targets.length) return 'Pick at least one target';
  const bad = s.targets.filter(id => supIssue(byId(id))).length;
  return bad ? `Remove ${plural(bad, 'invalid target')} to continue` : '';
}

/* live refresh of form-dependent bits without re-rendering inputs */
function refreshLive(v){

  const already = mine.filter(r => op === 'archive' ? r.archived_at : !r.archived_at);
  const todo = mine.filter(r => !already.includes(r));
  if (!todo.length) { await sleep(250); toast({ kind: 'info', title: `${already.map(r => r.short_id).join(', ')} ${op === 'archive' ? 'already archived' : 'is not archived'}`, body: 'idempotent — no change', ttl: 3500 }); return; }
  // optimistic: animate rows out, apply, then confirm with the server
  todo.forEach(r => { const el = $(`#c-stage .row[data-id="${r.id}"]`); if (el && !VS.c.showHidden && op === 'archive') el.classList.add('leaving'); });
  await sleep(150);
  const prev = todo.map(r => [r, r.archived_at]);
  applyArchive(todo.map(r => r.id), op); VS.c.sel.clear(); R('c');
  const res = await fakeCall('archive', { sids: todo.map(r => r.short_id) }, force);
  const sids = todo.map(r => r.short_id).join(', ');
  if (res.ok) {
    const undoOp = op === 'archive' ? 'restore' : 'archive';
    toast({ kind: 'ok', title: `${op === 'archive' ? 'Archived' : 'Restored'} ${todo.length === 1 ? sids : plural(todo.length, 'record')}`, body: (op === 'archive' ? 'hidden from recall · fetchable by id' : 'back in recall') + (already.length ? ` · ${already.length} already ${op === 'archive' ? 'archived' : 'live'}` : ''), ttl: 6000,
      actions: [{ label: `Undo <kbd>⌘Z</kbd>`, fn: () => quickArchive(todo.map(r => r.id), undoOp, 'success') }] });
    LAST_UNDO = () => quickArchive(todo.map(r => r.id), undoOp, 'success');
    return;
  }
  prev.forEach(([r, a]) => r.archived_at = a); flash('c', todo.map(r => r.id)); R('c');
  if (res.kind === 'reauth') toast({ kind: 'warn', title: `Session expired — ${op} not saved`, body: `${sids} put back. <code class="env-raw">${esc(res.env)}</code>`, actions: [{ label: 'Re-authenticate', fn: async () => { toast({ kind: 'info', title: 'Re-authenticating…', ttl: 900 }); await sleep(900); quickArchive(todo.map(r => r.id), op, 'success'); } }] });
  else toast({ kind: 'err', title: `${op === 'archive' ? 'Archive' : 'Restore'} rejected — ${sids} put back`, body: `<div class="status err" style="margin-top:4px">${envHTML(res)}</div>` });
}
let LAST_UNDO = null;
function actC(act, id){
  const st = VS.c;
  const pick = id => st.sel.size && (!id || st.sel.has(id)) ? [...st.sel] : [id];
  switch (act) {
    case 'menu': st.menu = st.menu === id ? null : id; break;
    case 'sup': st.menu = null; SESS.c = newSession(pick(id)); st.sel.clear(); break;
    case 'bulk-sup': SESS.c = newSession([...st.sel]); st.sel.clear(); break;
    case 'arc': st.menu = null; quickArchive(pick(id), 'archive'); return;
    case 'res': st.menu = null; quickArchive(pick(id), 'restore'); return;
    case 'bulk-arc': quickArchive([...st.sel], 'archive'); return;
    case 'bulk-res': quickArchive([...st.sel], 'restore'); return;
    case 'copy': st.menu = null; toast({ kind: 'info', title: `Copied ${byId(id).short_id}`, ttl: 1800 }); break;
    default: return false;
  }
  R('c');
}

/* ================= shared actions ================= */
const R = v => (v === 'a' ? renderA : v === 'b' ? renderB : renderC)();
async function doSupersede(v, force){
  const s = SESS[v]; if (!s || gateReason(s)) return;
  s.status = 'loading'; s.loadingText = `supersede_memory · ${plural(s.targets.length, 'target')}…`; s.res = null; s.errField = null; s.rejected = []; R(v);
  const sids = s.targets.map(id => byId(id).short_id);
  const res = await fakeCall('supersede', { form: s.form, sids }, force);
  if (SESS[v] !== s) return;
  if (res.ok) {
    s.result = applySupersede(s.targets, s.form); s.status = 'success';
    VS[v].sel.clear(); flash(v, [s.result.id]); buildDatalist();
    if (v === 'c') toast({ kind: 'ok', title: `Superseded ${s.targets.length} → ${s.result.short_id}`, body: 'no undo — supersession is additive history; supersede again to change it', ttl: 6000, actions: [{ label: 'View superseded', fn: () => viewSuperseded('c') }] });
  } else { s.status = 'error'; s.res = res; s.errField = res.field || null; s.rejected = res.targets || []; }
  R(v);
}
async function doArchive(v, force){
  const s = ARC[v]; s.status = 'loading'; s.loadingText = `spine-review ${s.op} · ${plural(s.ids.length, 'record')}…`; R(v);
  const res = await fakeCall('archive', { sids: s.ids.map(id => byId(id).short_id) }, force);
  if (ARC[v] !== s) return;
  if (res.ok) { s.result = applyArchive(s.ids, s.op); s.status = 'success'; VS[v].sel.clear(); flash(v, s.ids); }
  else { s.status = 'error'; s.res = res; }
  R(v);
}
async function doReauth(v, kind){
  const s = kind === 'arc' ? ARC[v] : SESS[v]; s.status = 'reauthing'; R(v);
  await sleep(900);
  kind === 'arc' ? doArchive(v, 'success') : doSupersede(v, 'success');
}
function viewSuperseded(v){
  const s = SESS[v]; if (!s || !s.result) return; const rec = s.result, st = VS[v];
  st.showHidden = true; flash(v, [...rec.supersedes, rec.id]);
  if (v === 'a') { st.modal = null; SESS.a = null; }
  if (v === 'b') { st.sheet = { type: 'detail', id: rec.id }; SESS.b = null; }
  if (v === 'c') { /* keep the result strip; list now includes hidden rows */ }
  R(v);
  const first = $(`#${v}-stage .row[data-id="${rec.supersedes[0]}"]`); first && first.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function closeTop(v){
  const st = VS[v]; hidePeek();
  if (v === 'a' && st.modal) { const sc = $('#a-overlay .scrim'); sc && sc.classList.remove('open'); setTimeout(() => { st.modal = null; SESS.a = null; ARC.a = null; R('a'); }, 150); return true; }
  if (v === 'b' && st.sheet) { const sh = $('#b-overlay .sheet'); sh && sh.classList.remove('open'); setTimeout(() => { st.sheet = null; SESS.b = null; ARC.b = null; st.sel.clear(); R('b'); }, 150); return true; }
  if (v === 'c') { if (st.menu) { st.menu = null; R('c'); return true; } if (SESS.c) { SESS.c = null; R('c'); return true; } }
  if (st.sel.size) { st.sel.clear(); R(v); return true; }
  return false;
}
function handleAct(v, act, id, el){
  const st = VS[v];
  switch (act) {
    case 'sel': {
      const s = SESS[v];
      if (v === 'b' && s && s.step === 1 && s.status !== 'success') { toggleTarget(v, id); return; }
      if (v === 'b' && s && s.status !== 'success') { R(v); return; }
      if (v === 'c' && s && s.status !== 'success') { toggleTarget(v, id); return; }
      st.sel.has(id) ? st.sel.delete(id) : st.sel.add(id); R(v); return; }
    case 'toggle-hidden': st.showHidden = !st.showHidden; R(v); return;
    case 'clear-sel': st.sel.clear(); R(v); return;
    case 'rm-target': toggleTarget(v, id); return;
    case 'swap-head': { const s = SESS[v], h = headOf(byId(id)); s.targets = s.targets.map(x => x === id ? h.id : x); if (v === 'b') st.sel = new Set(s.targets); R(v); return; }
    case 'fill-example': { const s = SESS[v]; Object.assign(s.form, EXAMPLE); s.errField = null; R(v); return; }
    case 'submit-sup': doSupersede(v); return;
    case 'close': closeTop(v); return;
    case 'reauth': doReauth(v, el.dataset.kind); return;
    case 'view-superseded': viewSuperseded(v); return;
    case 'peek': peek(id, el); return;
  }
  const r = v === 'a' ? actA(act, id) : v === 'b' ? actB(act, id) : actC(act, id);
  return r;
}
function toggleTarget(v, id){
  const s = SESS[v]; if (!s) return;
  s.targets = s.targets.includes(id) ? s.targets.filter(x => x !== id) : [...s.targets, id];
  s.rejected = []; if (s.status === 'error') { s.status = 'idle'; s.res = null; }
  if (v === 'b') VS.b.sel = new Set(s.targets);
  if (v === 'c' && !s.targets.length) SESS.c = null;
  R(v);
}
function rowClick(v, id, e){
  const st = VS[v], rows = listRows(v); st.focus = rows.findIndex(r => r.id === id);
  const s = SESS[v];
  if (v === 'b') { if (s && s.step === 1 && s.status !== 'success') return toggleTarget('b', id); if (s && s.status !== 'success') { const el = $(`#b-stage .row[data-id="${id}"] .sid`); return el && peek(id, el); } return handleAct('b', 'open', id); }
  if (v === 'c' && s && s.status !== 'success') return toggleTarget('c', id);
  if (v === 'c' && st.menu) st.menu = null;
  st.sel.has(id) ? st.sel.delete(id) : st.sel.add(id);
  R(v);
}

/* ================= peek (get_memory by id) ================= */
function peek(id, anchor){
  const r = byId(id), p = $('#peek'), fr = $('#frame').getBoundingClientRect(), a = anchor.getBoundingClientRect();
  p.innerHTML = `<div class="ph">${dot(r)}<span class="mono sid">${r.short_id}</span><b style="flex:1">${r.category}</b>${wordsHTML(r)}<button class="x" onclick="hidePeek()">×</button></div><div>${esc(r.summary)}</div><div class="pc">${esc(r.content)}</div><div class="pf">get_memory ${r.short_id} · fetch-by-id ignores the recall gate${r.superseded_by ? ` · superseded_by ${byId(r.superseded_by).short_id}` : ''}${r.archived_at ? ` · archived_at ${r.archived_at.slice(0, 10)}` : ''}</div>`;
  p.classList.add('open');
  const w = Math.min(p.offsetWidth, fr.width - 24); let left = a.left - fr.left; if (left + w > fr.width - 12) left = fr.width - 12 - w; left = Math.max(12, left);
  let top = a.bottom - fr.top + 6; if (top + p.offsetHeight > fr.height - 12) top = Math.max(12, a.top - fr.top - p.offsetHeight - 6);
  p.style.left = left + 'px'; p.style.top = top + 'px';
}
function hidePeek(){ $('#peek').classList.remove('open'); }

/* ================= wiring ================= */
['a','b','c'].forEach(v => {
  const root = $('#variant-' + v);
  root.addEventListener('click', e => {
    if (e.target.classList.contains('scrim')) { closeTop(v); return; }
    const a = e.target.closest('[data-sact]');
    if (a && root.contains(a)) { if (a.tagName !== 'INPUT') e.preventDefault(); e.stopPropagation(); handleAct(v, a.dataset.sact, a.dataset.id, a); return; }
    if (e.target.closest('.toasts, .dialog, .sheet, .inline-ed, .menu, input, select, textarea, button, label')) return;
    const row = e.target.closest('.row'); if (row) rowClick(v, row.dataset.id, e);
  });
  root.addEventListener('input', e => {
    const f = e.target.dataset.f; if (!f || !SESS[v]) return;
    SESS[v].form[f] = e.target.value;
    if (f === 'summary' && SESS[v].errField === 'summary' && bytes(e.target.value) <= 512) { SESS[v].errField = null; e.target.closest('.fld').classList.remove('err'); const fe = e.target.closest('.fld').querySelector('.ferr'); if (fe) fe.textContent = ''; }
    refreshLive(v);
  });
  root.addEventListener('change', e => {
    if (e.target.dataset.f && SESS[v]) { SESS[v].form[e.target.dataset.f] = e.target.value; refreshLive(v); }
    if (e.target.dataset.sactInput === 'add-target') {
      const q = e.target.value.trim().toLowerCase(), r = DB.find(x => x.short_id === q) || DB.find(x => q && x.short_id.startsWith(q));
      if (r && !SESS[v].targets.includes(r.id)) toggleTarget(v, r.id); else e.target.value = '';
    }
  });
  root.addEventListener('focusout', e => {
    if (e.target.dataset.f === 'content') { const fe = e.target.closest('.fld').querySelector('.ferr'); const empty = !e.target.value.trim(); fe.textContent = empty ? 'field=content hint=required: content must not be empty' : ''; e.target.closest('.fld').classList.toggle('err', empty); }
  });
});
document.addEventListener('click', e => { if (!e.target.closest('#peek') && !e.target.closest('[data-sact="peek"]')) hidePeek(); });

function showVariant(id, btn){
  if (id !== CUR) { DB = seed(); CLOCK = 0; resetState(); LAST_UNDO = null; $('#c-toasts').innerHTML = ''; buildDatalist(); }
  CUR = id; hidePeek();
  $$('.variant').forEach(v => v.classList.remove('active'));
  $$('.variant-tab').forEach(t => t.classList.remove('active'));
  $('#variant-' + id).classList.add('active');
  (btn || (typeof event !== 'undefined' && event && event.target) || $(`.variant-tab[data-v="${id}"]`)).classList.add('active');
  R(id);
}

document.addEventListener('keydown', e => {
  const v = CUR, st = VS[v];
  const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
  if (e.key === 'Escape' && !dpop.hidden) { e.preventDefault(); closeDisplay(true); return; }
  if (e.target.closest && e.target.closest('#display-pop')) return;
  if (e.key === 'Escape') { if (typing) e.target.blur(); closeTop(v); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { if (SESS[v] && SESS[v].status !== 'success' && !(v === 'b' && SESS.b.step === 1)) { e.preventDefault(); doSupersede(v); } return; }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && v === 'c' && LAST_UNDO && !typing) { e.preventDefault(); const f = LAST_UNDO; LAST_UNDO = null; f(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (v === 'a' && st.modal) return;
  const rows = listRows(v); if (!rows.length) return;
  const cur = rows[Math.max(0, st.focus)];
  const keys = { j: 1, ArrowDown: 1, k: -1, ArrowUp: -1 };
  if (e.key in keys) { e.preventDefault(); st.focus = Math.max(0, Math.min(rows.length - 1, st.focus + keys[e.key])); R(v); const el = $(`#${v}-stage .row.focus`); el && el.scrollIntoView({ block: 'nearest' }); return; }
  if (v === 'b' && SESS.b && SESS.b.status !== 'success' && !['x','h'].includes(e.key)) return;
  switch (e.key) {
    case 'x': handleAct(v, 'sel', cur.id); break;
    case 'h': st.showHidden = !st.showHidden; R(v); break;
    case 's': if (!(v === 'b' && SESS.b)) handleAct(v, st.sel.size ? 'bulk-sup' : 'sup', cur.id); break;
    case 'e': handleAct(v, st.sel.size ? 'bulk-arc' : 'arc', cur.id); break;
    case 'u': handleAct(v, st.sel.size ? 'bulk-res' : 'res', cur.id); break;
    case 'Enter': e.preventDefault(); if (v === 'a') { inChain(cur) ? handleAct('a', 'chain', cur.id) : handleAct('a', 'sup', cur.id); } else if (v === 'b') handleAct('b', 'open', cur.id); else { const el = $(`#c-stage .row.focus .sid`); el && peek(cur.id, el); } break;
    case 'c': if (v === 'c') handleAct('c', 'copy', cur.id); break;
    default: return;
  }
  e.preventDefault();
});

// scenario + reset
$('#mode-seg').addEventListener('click', e => { const b = e.target.closest('[data-mode]'); if (!b) return; MODE = b.dataset.mode; $$('#mode-seg button').forEach(x => x.classList.toggle('on', x === b)); });
$('#reset-btn').addEventListener('click', () => { DB = seed(); CLOCK = 0; resetState(); $('#c-toasts').innerHTML = ''; buildDatalist(); ['a','b','c'].forEach(R); });
function buildDatalist(){ $('#dl-sids').innerHTML = DB.map(r => `<option value="${r.short_id}">${esc(r.summary)}</option>`).join(''); }

/* ================= sketch toolbar ================= */
$('#theme-sel').addEventListener('change', e => { $('#theme-link').href = '../themes/' + e.target.value + '.css'; });
$('#vp-g').addEventListener('click', e => { const b = e.target.closest('[data-vp]'); if (!b) return; const f = $('#frame'); f.style.maxWidth = b.dataset.vp === 'full' ? '100%' : b.dataset.vp + 'px'; f.classList.toggle('constrained', b.dataset.vp !== 'full'); $$('#vp-g button').forEach(x => x.classList.toggle('on', x === b)); });
let ANNO = false, annoEl = null;
const rgbHex = c => { const m = c.match(/\d+(\.\d+)?/g); if (!m || (m[3] !== undefined && +m[3] === 0)) return 'transparent'; return '#' + m.slice(0, 3).map(x => (+x).toString(16).padStart(2, '0')).join('') + (m[3] !== undefined && +m[3] < 1 ? ` @${(+m[3]).toFixed(2)}` : ''); };
$('#anno-btn').addEventListener('click', e => { ANNO = !ANNO; e.target.classList.toggle('on', ANNO); if (!ANNO) { $('#anno-tip').style.display = 'none'; annoEl && annoEl.classList.remove('anno-hl'); } });
document.addEventListener('mousemove', e => {
  if (!ANNO) return; const t = e.target; if (t.closest('#sketch-tools') || t.id === 'anno-tip') return;
  if (annoEl !== t) { annoEl && annoEl.classList.remove('anno-hl'); annoEl = t; t.classList.add('anno-hl'); }
  const cs = getComputedStyle(t), rc = t.getBoundingClientRect(), tip = $('#anno-tip');
  tip.textContent = `${t.tagName.toLowerCase()}${t.className && typeof t.className === 'string' ? '.' + t.className.replace('anno-hl', '').trim().split(/\s+/).filter(Boolean).join('.') : ''}\n${Math.round(rc.width)}×${Math.round(rc.height)}  font ${cs.fontSize}/${cs.lineHeight} ${cs.fontWeight}\ncolor ${rgbHex(cs.color)}  bg ${rgbHex(cs.backgroundColor)}\npadding ${cs.padding}  radius ${cs.borderRadius}`;
  tip.style.display = 'block'; tip.style.left = Math.min(e.clientX + 14, innerWidth - 370) + 'px'; tip.style.top = Math.min(e.clientY + 14, innerHeight - 80) + 'px';
});

/* ---------------- Display popover: console-wide text size ----------------
   themes/display.js owns the value, its persistence, cross-page/tab sync and the global
   ⌘+ / ⌘- / ⌘0 shortcuts; this only renders and sets it (same popover as sketch 001 B′). */
const DISP=window.EngramDisplay;
const MOD=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent)?'⌘':'Ctrl';
const dpop=document.getElementById('display-pop'), tsSeg=document.getElementById('ts-seg');
let textSize=DISP.get();
document.getElementById('ts-keys').innerHTML=`<span><kbd>${MOD}</kbd><kbd>+</kbd> larger</span><span><kbd>${MOD}</kbd><kbd>−</kbd> smaller</span><span><kbd>${MOD}</kbd><kbd>0</kbd> reset to ${DISP.DEFAULT}</span>`;
function paintTextSize(){
  document.getElementById('ts-val').textContent=textSize+'px';
  tsSeg.querySelectorAll('button').forEach(b=>{const on=+b.dataset.ts===textSize;b.setAttribute('aria-checked',on);b.tabIndex=on?0:-1});
}
window.addEventListener('engram:textsize',e=>{
  const n=e.detail.size, changed=n!==textSize; textSize=n; paintTextSize();
  const btn=document.querySelector('.aa[aria-expanded=true]'); if(btn&&!dpop.hidden) placeDisplay(btn);
  TS_TOAST(`Text size ${n}px${changed?'':n===DISP.MAX?' (max)':n===DISP.MIN?' (min)':''}`);
});
function placeDisplay(btn){
  const r=btn.getBoundingClientRect();
  dpop.style.left=Math.max(8,Math.min(r.right-dpop.offsetWidth,innerWidth-dpop.offsetWidth-8))+'px'; dpop.style.top=(r.bottom+6)+'px';
}
function openDisplay(btn){
  dpop.hidden=false; placeDisplay(btn); btn.setAttribute('aria-expanded','true');
  (tsSeg.querySelector('[aria-checked=true]')||tsSeg.firstElementChild).focus();
}
function closeDisplay(refocus){
  if(dpop.hidden) return; dpop.hidden=true;
  const btn=document.querySelector('.aa[aria-expanded=true]'); if(btn){ btn.setAttribute('aria-expanded','false'); if(refocus) btn.focus(); }
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act=display]'); if(b) dpop.hidden?openDisplay(b):closeDisplay(true)});
tsSeg.addEventListener('click',e=>{const b=e.target.closest('button');if(b){DISP.set(+b.dataset.ts);b.focus()}});
tsSeg.addEventListener('keydown',e=>{
  const d={ArrowLeft:-1,ArrowDown:-1,ArrowRight:1,ArrowUp:1}[e.key]; if(!d) return;
  e.preventDefault(); e.stopPropagation(); DISP.step(d); tsSeg.querySelector('[aria-checked=true]').focus();
});
document.addEventListener('mousedown',e=>{ if(!e.target.closest('#display-pop')&&!e.target.closest('[data-act=display]')) closeDisplay(false) });
paintTextSize();
function TS_TOAST(html){ const t = document.getElementById('ts-toast'); t.innerHTML = html; t.classList.add('show'); clearTimeout(TS_TOAST._t); TS_TOAST._t = setTimeout(() => t.classList.remove('show'), 1800); }

buildDatalist();
['a','b','c'].forEach(R);
